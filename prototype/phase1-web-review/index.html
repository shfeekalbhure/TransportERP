<script>
const screens=[
{id:'MS-001',title:'تسجيل الدخول — سطح المكتب',gap:false,fields:['اسم المستخدم','كلمة المرور','إظهار/إخفاء كلمة المرور','تذكر المستخدم','تسجيل الدخول','نسيت كلمة المرور'],tabs:[],body:['الحالة: معتمد.','التبويبات: لا توجد. الشاشة مسار تحقق مركز.','الانتقال: بعد نجاح المصادقة، إذا كان للمستخدم أكثر من نطاق عمل ينتقل إلى MS-002، وإلا إلى MS-003 حسب الصلاحيات.']},
{id:'MS-002',title:'اختيار نطاق العمل',gap:false,fields:['الشركة','الفرع'],tabs:[],body:['الحالة: معتمد عند الحاجة فقط.','الغرض: اختيار الشركة/الفرع بعد التحقق من المستخدم عندما تكون له أكثر من شركة أو فرع مسموح.','التبويبات: لا توجد.','قاعدة: لا يعرض للمستخدم نطاق خارج صلاحياته.']},
{id:'MS-003',title:'الرئيسية — سطح المكتب',gap:false,fields:[],tabs:[],body:['الحالة: CLOSED FOR ANALYSIS / التفاصيل البصرية النهائية لاحقة.','واجهة RTL.','شجرة النظام في اليمين.','مساحة العمل المركزية لفتح الشاشات.','حاوية مساندة في اليسار.','شريط للشاشات المفتوحة.','سياق الشركة/الفرع/المستخدم والصلاحيات يحكم ما يظهر.','المهام/طلبات Workflow منفصلة عن التنبيهات والاستثناءات.','التبويبات: لا تعتمد Tabs ثابتة للرئيسية؛ شريط الشاشات المفتوحة عنصر تنقل وليس تبويب بيانات داخل شاشة.']},
{id:'MS-004',title:'تسجيل الدخول — تطبيق المكتب على الجوال',gap:false,fields:['اسم المستخدم/الجوال','كلمة المرور','إظهار/إخفاء','تذكر المستخدم','تسجيل الدخول','نسيت كلمة المرور'],tabs:[],body:['الحالة: معتمد.','نفس أساس المصادقة في سطح المكتب مع تكييف العرض للجوال: اسم المستخدم/الجوال، كلمة المرور، إظهار/إخفاء، تذكر المستخدم، تسجيل الدخول، نسيت كلمة المرور. الصلاحيات ونطاق العمل بعد التحقق.','التبويبات: لا توجد.']},
{id:'MS-005',title:'الرئيسية — تطبيق المكتب على الجوال',gap:false,fields:[],tabs:[],body:['الحالة: معتمد — Companion App للعمل السريع والميداني، وليس نسخة مصغرة من سطح المكتب.','التبويبات: الأقسام أعلاه أقسام رئيسية في Home وليست بالضرورة Tab Control؛ لا نحولها إلى Tabs إلا بقرار تصميم لاحق.']},
{id:'MS-006',title:'الرئيسية — تطبيق العميل',gap:false,fields:[],tabs:[],body:['الحالة: مغلق تحليليًا.','Contextual Service Home وليست واجهة نظام إداري.','الأولوية للعملية/الخدمة الجارية.','عند عدم وجود عملية جارية تتيح بدء خدمة جديدة.','إشعارات العميل خدمية وليست تنبيهات تشغيل داخلية.','التبويبات: غير مثبتة نهائيًا في القرارات المسترجعة؛ لا تُخترع في V1.']},
{id:'MS-007',title:'الرئيسية — تطبيق السائق',gap:false,fields:[],tabs:[],body:['الحالة: مغلق تحليليًا.','واجهة تنفيذ ميداني تقود السائق مباشرة إلى الإجراء التالي.','تعرض حالة السائق، المهمة الحالية والتالية، المهام، التنبيهات التشغيلية، «ما معي الآن»، العهدة، الاتصال/GPS والمزامنة، والإبلاغ عن مشكلة.','حالات الاستخدام الحاكمة: بلا مهمة؛ في مهمة؛ مهمة قادمة؛ انتهت المهمة وبقيت عهدة/تسوية؛ والعمل دون اتصال.','التبويبات: غير مثبتة كتَبويبات نهائية؛ العناصر أعلاه مناطق/حالات رئيسية ولا تُرقّى إلى Tabs بلا قرار.']},
{id:'MS-008',title:'المؤسسات والفروع',gap:false,fields:[],tabs:[],body:['الحالة: يعتمد مع تعديل','التبويبات/الهيكل: لا أسماء Tabs من ONYX تُنقل','قرار المصالحة: TransportERP يدمج المؤسسات والفروع؛ ONYX يثبت الشركات والفروع كواجهات مستقلة. يبقى الدمج قرار مشروع مع فصل بصري ووظيفي واضح.']},
{id:'MS-009',title:'الإعدادات العامة',gap:true,fields:[],tabs:[],body:['الحالة: يعتمد مع تعديل جوهري','التبويبات/الهيكل: غير محددة نهائيًا','قرار المصالحة: محرك Key/Value مناسب تقنيًا، لكن الواجهة التشغيلية يجب أن تنظم الإعدادات حسب المجال بدل شاشة مفاتيح عامة فقط.']},
{id:'MS-010',title:'إعدادات المؤسسة والفرع',gap:true,fields:[],tabs:[],body:['الحالة: يعتمد مع تعديل','التبويبات/الهيكل: Scope/Override كهيكل وظيفي','قرار المصالحة: يحافظ على Company/Branch scope وEffective precedence وReset override؛ أسماء Tabs النهائية قرار TransportERP.']},
{id:'MS-011',title:'الفترات والعملات والأبعاد',gap:false,fields:['الفترات المالية','العملات','الأبعاد'],tabs:['الفترات المالية','العملات','الأبعاد'],body:['الحالة: يعتمد مع تعديل','التبويبات/الهيكل: الفترات المالية | العملات | الأبعاد','قرار المصالحة: هذه Tabs مثبتة في عقد TransportERP، لكنها تجميع خاص بالمشروع وليست ادعاءً بأنها Tabs ONYX نفسها.']},
{id:'MS-012',title:'دليل الحسابات',gap:false,fields:['رمز الحساب','اسم الحساب','الحساب الأب','النوع','حساب ترحيل','العملة','الحالة','البحث','تاريخ السريان'],tabs:[],body:['الحالة: يعتمد مع تعديل محدود','التبويبات/الهيكل: Tree + Details؛ لا Tabs نهائية مثبتة','قرار المصالحة: يبقى Tree + Code/Names/Parent/Type/Posting/Currency/Status/Search/Effective date؛ لا ننقل Tabs ONYX القديمة غير المثبتة.']},
{id:'MS-013',title:'طلبات قيود اليومية',gap:true,fields:[],tabs:[],body:['الحكم: ONYX يثبت دورة طلب مستقلة؛ تُضاف كشاشة مستقلة في Master بدل إخفائها داخل قيد اليومية.','التبويبات التفصيلية: لم تُعتمد بعد في TransportERP Master؛ تُستكمل من المصالحة دون تخمين.']},
{id:'MS-014',title:'قيود اليومية',gap:true,fields:[],tabs:[],body:['الحكم: تبقى شاشة الوثيقة المحاسبية الفعلية؛ الطلب لا يدمج معها دون فصل صريح.','التبويبات التفصيلية: لم تُعتمد بعد في TransportERP Master؛ تُستكمل من المصالحة دون تخمين.']},
{id:'MS-015',title:'طلبات سندات القبض',gap:true,fields:[],tabs:[],body:['الحكم: تُفصل عن سند القبض لأن دورة الطلب والاعتماد مثبتة كمرحلة مستقلة.','التبويبات التفصيلية: لم تُعتمد بعد في TransportERP Master؛ تُستكمل من المصالحة دون تخمين.']},
{id:'MS-016',title:'سند القبض',gap:true,fields:[],tabs:[],body:['الحكم: شاشة الوثيقة الفعلية بعد الطلب أو الإدخال المباشر بحسب القواعد المعتمدة لاحقًا.','التبويبات التفصيلية: لم تُعتمد بعد في TransportERP Master؛ تُستكمل من المصالحة دون تخمين.']},
{id:'MS-017',title:'طلبات سندات الصرف',gap:true,fields:[],tabs:[],body:['الحكم: تُفصل عن سند الصرف لأن الطلب له مراجعة/اعتماد قبل الصرف.','التبويبات التفصيلية: لم تُعتمد بعد في TransportERP Master؛ تُستكمل من المصالحة دون تخمين.']},
{id:'MS-018',title:'سند الصرف',gap:true,fields:[],tabs:[],body:['الحكم: شاشة الوثيقة الفعلية؛ لا يكفي Tab «الصرف» وحده لتمثيل دورة الطلب.','التبويبات التفصيلية: لم تُعتمد بعد في TransportERP Master؛ تُستكمل من المصالحة دون تخمين.']},
{id:'MS-019',title:'متغيرات الأستاذ العام',gap:true,fields:['تسلسل طلبات قيود اليومية','تسلسل طلبات سندات الصرف','تسلسل الإشعارات','تسلسل قيود اليومية','عدد الحقول الإضافية','استخدام حساب الصندوق في القيود','إنزال أكثر من إشعار للقيد','إنزال أكثر من طلب صرف للسند','فحص الصناديق المرتبطة بالفروع','السماح بالسندات الصفرية','إجبارية رقم المرجع'],tabs:[],body:['العناصر المثبتة من ONYX: تسلسل طلبات قيود اليومية؛ تسلسل طلبات سندات الصرف؛ تسلسل الإشعارات؛ تسلسل قيود اليومية؛ عدد الحقول الإضافية؛ استخدام حساب الصندوق في القيود؛ إنزال أكثر من إشعار للقيد؛ إنزال أكثر من طلب صرف للسند؛ فحص الصناديق المرتبطة بالفروع؛ السماح بالسندات الصفرية؛ إجبارية رقم المرجع.','التبويبات: لم يثبت اسم مجموعة Tabs كاملة؛ لا تُخترع.','TransportERP: لا شاشة مستقلة مقابلة مثبتة حاليًا. الحكم: يحتاج قرار تصميم وتغطية.']},
{id:'MS-020',title:'مجموعات الصناديق',gap:true,fields:['رقم المجموعة','الاسم المحلي','الاسم الأجنبي','إضافة','حفظ'],tabs:[],body:['العناصر المثبتة: رقم المجموعة؛ الاسم المحلي؛ الاسم الأجنبي؛ إضافة؛ حفظ.','التبويبات/الهيكل: لا تبويبات مثبتة.','TransportERP: لا شاشة مستقلة مقابلة مثبتة في العقود التي راجعناها. الحكم: يحتاج قرار؛ لا تضاف تلقائيًا.']},
{id:'MS-021',title:'مجموعات البنوك',gap:true,fields:['رقم المجموعة','الاسم المحلي','الاسم الأجنبي','إضافة','حفظ'],tabs:[],body:['العناصر المثبتة: رقم المجموعة؛ الاسم المحلي؛ الاسم الأجنبي؛ إضافة؛ حفظ.','التبويبات/الهيكل: لا تبويبات مثبتة.','TransportERP: لا شاشة مستقلة مقابلة مثبتة في العقود التي راجعناها. الحكم: يحتاج قرار؛ لا تضاف تلقائيًا.']},
{id:'MS-022',title:'أنواع الإشعارات',gap:true,fields:['رقم النوع','الاسم المحلي','الاسم الأجنبي','نوع الإشعار مدين/دائن','إضافة','حفظ'],tabs:['الصلاحيات'],body:['العناصر المثبتة: رقم النوع؛ الاسم المحلي؛ الاسم الأجنبي؛ نوع الإشعار مدين/دائن؛ إضافة؛ حفظ.','التبويبات/الهيكل: تبويب «الصلاحيات» مثبت.','TransportERP: لا شاشة مستقلة مقابلة مثبتة في العقود التي راجعناها. الحكم: يحتاج قرار؛ لا تضاف تلقائيًا.']},
{id:'MS-023',title:'أنواع الطلبات',gap:true,fields:['نوع الطلب','رقم/تسلسل النوع','السماح بتعديل المبالغ عند الإنزال','إضافة','حفظ'],tabs:['الصلاحيات'],body:['العناصر المثبتة: نوع الطلب؛ رقم/تسلسل النوع؛ السماح بتعديل المبالغ عند الإنزال؛ إضافة؛ حفظ.','التبويبات/الهيكل: تبويب «الصلاحيات» مثبت.','TransportERP: لا شاشة مستقلة مقابلة مثبتة في العقود التي راجعناها. الحكم: يحتاج قرار؛ لا تضاف تلقائيًا.']},
{id:'MS-024',title:'أنواع قيود اليومية',gap:true,fields:['نوع قيد اليومية','إضافة','حفظ'],tabs:[],body:['العناصر المثبتة: نوع قيد اليومية؛ إضافة؛ حفظ.','التبويبات/الهيكل: الصلاحيات مثبتة كعنصر/تبويب؛ مجموعة الحقول الكاملة جزئية.','TransportERP: لا شاشة مستقلة مقابلة مثبتة في العقود التي راجعناها. الحكم: يحتاج قرار؛ لا تضاف تلقائيًا.']},
{id:'MS-025',title:'أنواع القبض والصرف',gap:true,fields:['نوع قبض/صرف','الأنواع الضريبية المشروطة','عرض','إضافة','حفظ'],tabs:[],body:['العناصر المثبتة: نوع قبض/صرف؛ بعض الأنواع الضريبية المشروطة؛ عرض؛ إضافة؛ حفظ.','التبويبات/الهيكل: لا تُخلط مع طرق الدفع.','TransportERP: لا شاشة مستقلة مقابلة مثبتة في العقود التي راجعناها. الحكم: يحتاج قرار؛ لا تضاف تلقائيًا.']},

const nav=document.getElementById('nav'),screen=document.getElementById('screen'),q=document.getElementById('q');document.getElementById('gapCount').textContent=screens.filter(x=>x.gap).length+' شاشة بها فجوة/قرار مفتوح';
function safe(s){return(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function mkNav(list=screens){nav.innerHTML='';list.forEach(s=>{const b=document.createElement('button');b.dataset.id=s.id;b.innerHTML=`<b>${s.id}</b> — ${safe(s.title)}<small>${s.gap?'فجوة/قرار مفتوح':'مغطى بما هو مثبت'}</small>`;b.onclick=()=>render(s.id);nav.appendChild(b)})}q.oninput=()=>{const z=q.value.trim();mkNav(screens.filter(s=>(s.id+' '+s.title+' '+s.body.join(' ')).includes(z)))};
function fieldControl(name){const isAction=['إضافة','حفظ','عرض','تسجيل الدخول','نسيت كلمة المرور','F9 للاستدعاء','إضافة أرقام الشيكات'].includes(name);if(isAction)return`<button class="btn ${name==='حفظ'||name==='تسجيل الدخول'?'primary':''}" onclick="alert('محاكاة تفاعلية: ${safe(name)}')">${safe(name)}</button>`;const isBool=/يتطلب|يسمح|إجبارية|فحص|استخدام|السماح|إنزال أكثر|تذكر|إظهار/.test(name);if(isBool)return`<div class="field"><label>${safe(name)}</label><select><option>— اختر —</option><option>نعم</option><option>لا</option></select></div>`;return`<div class="field"><label>${safe(name)}</label><input placeholder="${safe(name)}"></div>`}
function special(s){if(s.id==='MS-001'||s.id==='MS-004'){return`<div class="loginbox card"><h2>${safe(s.title)}</h2><div class="grid">${s.fields.filter(x=>!['تسجيل الدخول','نسيت كلمة المرور'].includes(x)).map(fieldControl).join('')}</div><div class="actionrow">${s.fields.filter(x=>['تسجيل الدخول','نسيت كلمة المرور'].includes(x)).map(fieldControl).join('')}</div></div>`}if(s.id==='MS-003'){return`<div class="home-layout"><div class="mockpane"><b>شجرة النظام — يمين</b><p>العناصر الظاهرة يحكمها السياق والصلاحيات.</p></div><div class="mockpane"><b>مساحة العمل المركزية</b><p>فتح الشاشات + شريط الشاشات المفتوحة.</p><p><b>المهام/Workflow</b> منفصلة عن <b>التنبيهات والاستثناءات</b>.</p></div><div class="mockpane"><b>الحاوية المساندة — يسار</b><p>سياق الشركة/الفرع/المستخدم.</p></div></div>`}return''}
function render(id){const s=screens.find(x=>x.id===id)||screens[0];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===s.id));const stored=localStorage.getItem('review_'+s.id)||'';let tabsHtml=s.tabs.length?`<div class="tabs">${s.tabs.map((t,i)=>`<button class="tab ${i===0?'on':''}" onclick="this.parentNode.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${safe(t)}</button>`).join('')}</div>`:'';let fieldsHtml=s.fields.length?`<div class="grid">${s.fields.filter(x=>!['إضافة','حفظ','عرض','تسجيل الدخول','نسيت كلمة المرور','F9 للاستدعاء','إضافة أرقام الشيكات'].includes(x)).map(fieldControl).join('')}</div><div class="actionrow">${s.fields.filter(x=>['إضافة','حفظ','عرض','تسجيل الدخول','نسيت كلمة المرور','F9 للاستدعاء','إضافة أرقام الشيكات'].includes(x)).map(fieldControl).join('')}</div>`:'';const sp=special(s);screen.innerHTML=`<div class="card"><div class="topbar"><div><h1>${s.id} — ${safe(s.title)}</h1><div>${s.gap?'<span class="badge gap">فجوة/قرار مفتوح — لا يتم التخمين</span>':'<span class="badge ok">مغطى بما هو مثبت في الكراسة</span>'}</div></div></div>${s.gap?'<div class="note">هذه الشاشة فيها عناصر أو تبويبات لم تُحسم نهائيًا. النموذج يعرض فقط ما ثبت في الكراسة، وأي نقص تراه سجّله في خانة المراجعة.</div>':''}</div>${sp||`<div class="card"><h2>الواجهة التفاعلية المبنية من العناصر المثبتة</h2>${tabsHtml}${fieldsHtml||'<div class="note">لا توجد حقول داخلية مثبتة بما يكفي في الكراسة الحالية لبناء حقول إضافية دون تخمين.</div>'}</div>`}<div class="card"><h2>النص الحاكم من الكراسة</h2><div class="evidence">${safe(s.body.join('\n'))}</div></div><div class="card"><h2>مراجعتك لهذه الشاشة</h2><div class="review"><textarea id="reviewBox" placeholder="اكتب الحقل الناقص، التبويب، الحركة أو الملاحظة...">${safe(stored)}</textarea><div><button class="btn primary" style="width:100%" onclick="saveReview('${s.id}')">حفظ الملاحظة</button><button class="btn" style="width:100%;margin-top:8px" onclick="nextScreen('${s.id}')">التالي بالتسلسل</button></div></div></div>`}
function saveReview(id){localStorage.setItem('review_'+id,document.getElementById('reviewBox').value);updateReviewCount();alert('تم حفظ الملاحظة محليًا لهذه الشاشة')}function updateReviewCount(){let n=screens.filter(s=>localStorage.getItem('review_'+s.id)).length;document.getElementById('reviewCount').textContent=n+' ملاحظة محفوظة محليًا'}function nextScreen(id){let i=screens.findIndex(x=>x.id===id);if(i<screens.length-1)render(screens[i+1].id);else alert('وصلت إلى نهاية المرحلة الأولى MS-030')}mkNav();render('MS-001');updateReviewCount();
</script></body></html>
