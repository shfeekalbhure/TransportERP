name: TEAM-03 persistence remediation bootstrap

on:
  push:
    branches:
      - feature/p2-c01-c-release-trip-manifest-20260821
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-team03:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.head_ref == 'feature/p2-c01-c-release-trip-manifest-20260821'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current C branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/p2-c01-c-release-trip-manifest-20260821

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply bounded TEAM-03 patch
        run: python tools/team03_remediate.py

      - name: Guard C-only scope
        shell: bash
        run: |
          git diff --name-only
          if git diff --name-only | grep -E '/(Arrival|Warehouse|Delivery|Customs|Commission|Settlement|Fleet|GPS|Notification|ExceptionResolution)|(^|/)(Arrival|Warehouse|Delivery|Customs|Commission|Settlement|Fleet|GPS)' ; then
            echo 'TEAM-03 leaked into a later phase.'
            exit 1
          fi

      - name: Restore and compile hardening
        run: |
          dotnet restore TransportERP.Tests/TransportERP.Tests.csproj
          dotnet build TransportERP.Tests/TransportERP.Tests.csproj --configuration Debug --no-restore

      - name: Commit bounded remediation and remove bootstrap files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/team03-remediation-bootstrap.yml tools/team03_remediate.py tools/team03_store_parts.txt
          git add -- TransportERP.Infrastructure/Persistence/ShippingExecutionPersistence.cs .github/workflows/p2-c01-c-shipping-execution.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'team03: apply persistence hardening'
          git push origin HEAD:feature/p2-c01-c-release-trip-manifest-20260821
