name: P2 C01 A waybill foundation

on:
  push:
    branches:
      - feature/p2-c01-a-waybill-foundation-20260820
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  waybill-foundation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align implementation to closed W1 Geo contract
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding($false)

          $appPath = 'TransportERP.Application/Waybills/WaybillApplicationService.cs'
          $app = [IO.File]::ReadAllText($appPath)
          $app = [regex]::Replace($app, 'input\.Address\.CountryId,\s*input\.Address\.GovernorateId,\s*input\.Address\.DirectorateId,\s*input\.Address\.CityId', 'input.Address.CountryId, input.Address.GovernorateId, input.Address.CityId')
          $app = [regex]::Replace($app, 'new GeoAddressSnapshot\(x\.CountryId,\s*x\.GovernorateId,\s*x\.DirectorateId,\s*x\.CityId', 'new GeoAddressSnapshot(x.CountryId, x.GovernorateId, x.CityId')
          [IO.File]::WriteAllText($appPath, $app, $utf8)

          $persistencePath = 'TransportERP.Infrastructure/Persistence/WaybillPersistenceServices.cs'
          $persistence = [IO.File]::ReadAllText($persistencePath)
          $persistence = [regex]::Replace($persistence, 'p\.CountryId,\s*p\.GovernorateId,\s*p\.DirectorateId,\s*p\.CityId,\s*p\.AreaId', 'p.CountryId, p.GovernorateId, p.CityId, p.AreaId')
          $persistence = [regex]::Replace($persistence, 'DirectorateId\s*=\s*x\.DirectorateId,\s*', '')
          $persistence = [regex]::Replace($persistence, 'DirectorateId\s*=\s*request\.Address\.DirectorateId,\s*', '')
          $persistence = [regex]::Replace($persistence, 'x\.CountryId,\s*x\.GovernorateId,\s*x\.DirectorateId,\s*x\.CityId,\s*x\.AreaId', 'x.CountryId, x.GovernorateId, x.CityId, x.AreaId')
          [IO.File]::WriteAllText($persistencePath, $persistence, $utf8)

          $entitiesPath = 'TransportERP.Infrastructure/Persistence/P2WaybillEntities.cs'
          $entities = [IO.File]::ReadAllText($entitiesPath)
          $entities = [regex]::Replace($entities, '(?m)^\s*public Guid\? DirectorateId \{ get; set; \}\r?\n', '')
          [IO.File]::WriteAllText($entitiesPath, $entities, $utf8)

          if (Select-String -Path $appPath,$persistencePath,$entitiesPath -Pattern 'DirectorateId' -Quiet) {
            throw 'DirectorateId remains in P2-C01-A implementation although closed W1 does not authorize it.'
          }

      - name: Persist W1 alignment before build
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TransportERP.Application/Waybills/WaybillApplicationService.cs TransportERP.Infrastructure/Persistence/P2WaybillEntities.cs TransportERP.Infrastructure/Persistence/WaybillPersistenceServices.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m 'fix: align P2-C01-A implementation with closed W1 geo contract'
            git push origin HEAD:feature/p2-c01-a-waybill-foundation-20260820
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.0

      - name: Restore core tests and dependencies
        run: dotnet restore TransportERP.Tests/TransportERP.Tests.csproj

      - name: Restore Desktop contract surface
        run: dotnet restore TransportERP.Desktop/TransportERP.Desktop.csproj

      - name: Build core runtime and tests
        run: dotnet build TransportERP.Tests/TransportERP.Tests.csproj --configuration Debug --no-restore

      - name: Build Desktop contract surface
        run: dotnet build TransportERP.Desktop/TransportERP.Desktop.csproj --configuration Debug --no-restore -p:OutputType=Library

      - name: Generate P2-C01-A migration when missing
        shell: pwsh
        env:
          TRANSPORTERP_DESIGN_CONNSTR: Host=localhost;Port=5432;Database=transporterp;Username=postgres;Password=postgres
        run: |
          $migration = Get-ChildItem 'TransportERP.Infrastructure/Persistence/Migrations' -Filter '*_P2C01AWaybillFoundation.cs' -ErrorAction SilentlyContinue | Where-Object { $_.Name -notlike '*.Designer.cs' }
          if (-not $migration) {
            dotnet ef migrations add P2C01AWaybillFoundation --project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj --startup-project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj --output-dir Persistence/Migrations
          }

      - name: Verify migration exists
        shell: pwsh
        run: |
          $migration = Get-ChildItem 'TransportERP.Infrastructure/Persistence/Migrations' -Filter '*_P2C01AWaybillFoundation.cs' -ErrorAction SilentlyContinue | Where-Object { $_.Name -notlike '*.Designer.cs' }
          if (-not $migration) { throw 'P2-C01-A migration was not generated.' }
          Write-Host "Migration: $($migration.Name)"

      - name: Run complete test suite
        run: dotnet test TransportERP.Tests/TransportERP.Tests.csproj --configuration Debug --no-build

      - name: Commit EF migration
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TransportERP.Infrastructure/Persistence/Migrations
          if (-not (git diff --cached --quiet)) {
            git commit -m 'db: generate P2-C01-A waybill foundation migration'
            git push origin HEAD:feature/p2-c01-a-waybill-foundation-20260820
          }
