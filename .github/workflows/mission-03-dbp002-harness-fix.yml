name: MISSION-03 DBP-002 Rehearsal Harness Fix

on:
  push:
    branches:
      - codex/mission-03-execution-20260828

permissions:
  contents: write

jobs:
  fix-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Apply deterministic harness-only corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/mission-03-dbp002-rehearsal.yml')
          s = p.read_text()
          old = s
          s = s.replace('FROM "__EFMigrationsHistory"', 'FROM transport_erp."__EFMigrationsHistory"')
          s = s.replace(
              "SELECT has_schema_privilege('public','transport_erp','CREATE');",
              "SELECT count(*) FROM pg_namespace n CROSS JOIN LATERAL aclexplode(COALESCE(n.nspacl,acldefault('n',n.nspowner))) a WHERE n.nspname='transport_erp' AND a.grantee=0 AND a.privilege_type='CREATE';")
          s = s.replace(
              'test "$(psqlq "SELECT count(*) FROM pg_constraint con JOIN pg_class c ON c.oid=con.conrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname=\'transport_erp\' AND c.relname IN (\'user_role_grants\',\'user_permission_grants\') AND con.contype=\'t\' AND con.condeferrable AND con.condeferred;")" = "3"',
              'test "$(psqlq "SELECT count(*) FROM pg_trigger t JOIN pg_constraint con ON con.oid=t.tgconstraint JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname=\'transport_erp\' AND c.relname IN (\'user_role_grants\',\'user_permission_grants\') AND NOT t.tgisinternal AND con.condeferrable AND con.condeferred;")" = "3"')
          s = s.replace("'\\\\x'::bytea", "decode('','hex')")
          if s == old:
              print('No harness corrections required.')
              raise SystemExit(0)
          p.write_text(s)
          PY
          git diff --check
          if git diff --quiet -- .github/workflows/mission-03-dbp002-rehearsal.yml; then
            exit 0
          fi
          git add .github/workflows/mission-03-dbp002-rehearsal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'MISSION-03 DBP-002: fix rehearsal catalog harness'
          git push origin "HEAD:${GITHUB_REF_NAME}"
