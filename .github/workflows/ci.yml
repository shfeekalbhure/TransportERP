            "$RUNNER_TEMP/android-device-registration-response.json" \
            "$RUNNER_TEMP/android-release-device-registration.json" \
            "$RUNNER_TEMP/android-release-device-registration-response.json" \
            "$RUNNER_TEMP/android-device-assignment.json" \
