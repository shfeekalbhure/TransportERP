      - name: Start API 35 emulator
        shell: bash
        run: |
          mkdir -p ci-evidence/android-runtime
          "$ANDROID_HOME/emulator/emulator" -version 2>&1 | head -n 1 > ci-evidence/android-runtime/emulator-version.txt
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd transporterptest \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -writable-system \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/android-emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/android-emulator.pid"
          adb wait-for-device
          booted=false
          for attempt in $(seq 1 150); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ]; then
              booted=true
              break
            fi
            sleep 2
          done
          test "$booted" = true

          tls_dir="$RUNNER_TEMP/android-e2e-tls"
          certificate_hash=$(openssl x509 -in "$tls_dir/server.crt" -subject_hash_old -noout | head -n 1)
          [[ "$certificate_hash" =~ ^[0-9a-f]{8}$ ]]
          adb root
          adb wait-for-device
          adb remount
          adb reboot
          timeout 30s adb wait-for-disconnect
          adb wait-for-device
          booted=false
          for attempt in $(seq 1 150); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ]; then
              booted=true
              break
            fi
            sleep 2
          done
          test "$booted" = true
          adb root
          adb wait-for-device
          adb remount
          adb shell 'touch /system/etc/security/cacerts/.transporterp-write-probe'
          adb shell 'rm /system/etc/security/cacerts/.transporterp-write-probe'
          adb push "$tls_dir/server.crt" "/system/etc/security/cacerts/${certificate_hash}.0"
          adb shell chmod 644 "/system/etc/security/cacerts/${certificate_hash}.0"
          adb reboot
          timeout 30s adb wait-for-disconnect
          adb wait-for-device
          booted=false
          for attempt in $(seq 1 150); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ]; then
              booted=true
              break
            fi
            sleep 2
          done
          test "$booted" = true
          adb shell test -r "/system/etc/security/cacerts/${certificate_hash}.0"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.version.sdk | tr -d '\r' | grep -Fx '35'
          {
            echo 'tls_validation=android-system-trust-store'
            echo "tls_certificate_sha256=$(cat "$tls_dir/server-cert-sha256.txt")"
            echo "tls_system_alias=${certificate_hash}.0"
            echo 'application_certificate_bypass=false'
          } > ci-evidence/android-runtime/tls-trust-evidence.txt

      - name: Run closed startup and native security restart proof
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          result_name='driver-device-test-result.json'
          apk=$(cat "$RUNNER_TEMP/android-device-test-apk.txt")
          adb_bounded() { timeout 30s adb "$@"; }
          app_pid() {
            adb_bounded shell pidof "$ANDROID_TEST_PACKAGE" 2>/dev/null \
              | tr -d '\r' || true
          }
          adb_bounded install -r "$apk"

          validate_result() {
            local phase="$1"
            local evidence="ci-evidence/android-runtime/${phase}.json"
            python3 - "$phase" "$evidence" <<'PY'
          import json
          import sys

          phase, path = sys.argv[1:]
          with open(path, encoding="utf-8") as stream:
              result = json.load(stream)
          if set(result) != {"schemaVersion", "phase", "passed", "code", "checks"}:
              raise SystemExit("Unexpected Android evidence schema.")
          if result["schemaVersion"] != 1 or result["phase"] != phase:
              raise SystemExit("Android evidence phase mismatch.")
          if result["passed"] is not True or result["code"] != "PASS":
              raise SystemExit(f"Android runtime phase failed with code {result['code']}.")
          if not result["checks"] or any(value is not True for value in result["checks"].values()):
              raise SystemExit("Android runtime check failed.")
          PY
          }

          run_phase() {
            local phase="$1"
            local temporary="$RUNNER_TEMP/android-${phase}-result.json"
            local maximum_attempts=60
            if [ "$phase" = e2e-submit ]; then maximum_attempts=150; fi
            echo "android_phase_start=$phase"
            adb_bounded shell run-as "$ANDROID_TEST_PACKAGE" rm -f "files/$result_name"
            adb_bounded shell am start -W \
              -n "$ANDROID_TEST_COMPONENT" \
              --es phase "$phase" >/dev/null
            complete=false
            for attempt in $(seq 1 "$maximum_attempts"); do
              # Some adb versions return exit code 0 while forwarding the remote
              # `cat: ... No such file` diagnostic on stdout.  Check existence in
              # the app sandbox first, then accept only a complete JSON document.
              if adb_bounded shell run-as "$ANDROID_TEST_PACKAGE" test -s "files/$result_name" >/dev/null 2>&1; then
                adb_bounded exec-out run-as "$ANDROID_TEST_PACKAGE" cat "files/$result_name" > "$temporary"
                if python3 -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$temporary"; then
                  complete=true
                  break
                fi
              fi
              sleep 1
            done
            test "$complete" = true
            mv "$temporary" "ci-evidence/android-runtime/${phase}.json"
            validate_result "$phase"
            echo "android_phase_complete=$phase"
          }

          adb_bounded shell pm clear "$ANDROID_TEST_PACKAGE" >/dev/null
          adb_bounded shell monkey \
            -p "$ANDROID_TEST_PACKAGE" \
            -c android.intent.category.LAUNCHER \
            1 >/dev/null
          for attempt in $(seq 1 30); do
            test -n "$(app_pid)" && break
            sleep 1
          done
          test -n "$(app_pid)"

          run_phase startup
          run_phase seed
          seed_pid=$(app_pid)
          test -n "$seed_pid"
          adb_bounded shell am force-stop "$ANDROID_TEST_PACKAGE"
          stopped=false
          for attempt in $(seq 1 30); do
            if [ -z "$(app_pid)" ]; then
              stopped=true
              break
            fi
            sleep 1
          done
          test "$stopped" = true

          run_phase verify
          verify_pid=$(app_pid)
          test -n "$verify_pid"
          run_phase loss
          adb_bounded shell run-as "$ANDROID_TEST_PACKAGE" dd \
            of=files/driver-device-e2e-input.json status=none \
            < "$RUNNER_TEMP/android-e2e-input.json"
          adb_bounded shell run-as "$ANDROID_TEST_PACKAGE" chmod 600 \
            files/driver-device-e2e-input.json
          run_phase e2e-submit
          e2e_submit_pid=$(app_pid)
          test -n "$e2e_submit_pid"
          adb_bounded shell am force-stop "$ANDROID_TEST_PACKAGE"
          e2e_stopped=false
          for attempt in $(seq 1 30); do
            if [ -z "$(app_pid)" ]; then
              e2e_stopped=true
              break
            fi
            sleep 1
          done
          test "$e2e_stopped" = true
          run_phase e2e-verify
          e2e_verify_pid=$(app_pid)
          test -n "$e2e_verify_pid"
          {
            echo 'process_stopped_before_restart=true'
            echo 'new_process_observed_after_restart=true'
            echo 'business_process_stopped_before_restart=true'
            echo 'business_operation_succeeded_after_restart=true'
            echo 'offline_runtime_active_at_cleanup=false'
            echo 'ci_test_runtime_was_activated=true'
            echo 'raw_security_artifacts_exported=false'
          } > ci-evidence/android-runtime/restart-evidence.txt
          adb_bounded shell am force-stop "$ANDROID_TEST_PACKAGE"
          adb_bounded shell pm clear "$ANDROID_TEST_PACKAGE" >/dev/null

      - name: Switch the API allowlist to the exact Android Release candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          connection='Host=127.0.0.1;Port=5432;Database=transporter_android_ci;Username=transporter_android_ci;Password=android-ci-database-password;Include Error Detail=false'
          tls_dir="$RUNNER_TEMP/android-e2e-tls"
          api_content_root="$PWD/TransportERP.Api/bin/Release/net10.0"
          release_signer_sha=$(cat "$RUNNER_TEMP/android-release-signer-sha256.txt")
          [[ "$release_signer_sha" =~ ^[0-9a-f]{64}$ ]]
          kill "$(cat "$RUNNER_TEMP/android-e2e-api.pid")"
          wait "$(cat "$RUNNER_TEMP/android-e2e-api.pid")" || true
          nohup env \
            "TRANSPORTERP_CONNECTION_STRING=$connection" \
            "ASPNETCORE_CONTENTROOT=$api_content_root" \
            'Auth__Mode=LocalSessions' \
            'Auth__Issuer=transporter-android-ci' \
            'Auth__Audience=transporter-android-ci' \
            'Auth__SigningKeyId=android-ci-current' \
            'Auth__SigningKey=android-ci-signing-key-at-least-thirty-two-characters' \
            'AllowedHosts=localhost;127.0.0.1;10.0.2.2' \
            'Sync__Proof__PublicOrigin=https://10.0.2.2:8443' \
            'ASPNETCORE_ENVIRONMENT=Development' \
            'ASPNETCORE_URLS=https://0.0.0.0:8443' \
            "ASPNETCORE_Kestrel__Certificates__Default__Path=$tls_dir/server.pfx" \
            'ASPNETCORE_Kestrel__Certificates__Default__Password=android-ci-tls-password' \
            'Sync__Offline__Enabled=true' \
            'Sync__ServerExecution__Enabled=true' \
            'Sync__Offline__ActivationDecisionId=DEC-G5-PR69-ANDROID-RELEASE-E2E' \
            "Sync__Offline__ActivationImplementationSha=$EXPECTED_SHA" \
            'Sync__Offline__AuthorizedBuilds__0__Platform=android' \
            "Sync__Offline__AuthorizedBuilds__0__ArtifactSha256=$ANDROID_E2E_RELEASE_ARTIFACT_SHA" \
            "Sync__Offline__AuthorizedBuilds__0__SignerCertificateSha256=$release_signer_sha" \
            'Sync__EffectivePolicy__SourceVersion=android-release-ci-e2e-v1' \
            "Sync__EffectivePolicy__Devices__${ANDROID_E2E_RELEASE_REGISTERED_DEVICE_ID}__CompanyId=$ANDROID_E2E_COMPANY_ID" \
            "Sync__EffectivePolicy__Devices__${ANDROID_E2E_RELEASE_REGISTERED_DEVICE_ID}__BranchId=$ANDROID_E2E_BRANCH_ID" \
            "Sync__EffectivePolicy__Devices__${ANDROID_E2E_RELEASE_REGISTERED_DEVICE_ID}__DeviceId=android-ci-release-device" \
            "Sync__EffectivePolicy__Devices__${ANDROID_E2E_RELEASE_REGISTERED_DEVICE_ID}__AllowedActions__0=CreateOperationalParty" \
            "Sync__EffectivePolicy__Devices__${ANDROID_E2E_RELEASE_REGISTERED_DEVICE_ID}__MaxBatchOperations=1" \
            "Sync__EffectivePolicy__Devices__${ANDROID_E2E_RELEASE_REGISTERED_DEVICE_ID}__MaximumRequestBodyBytes=4096" \
            "Sync__EffectivePolicy__Devices__${ANDROID_E2E_RELEASE_REGISTERED_DEVICE_ID}__MaximumPayloadBytes=1024" \
            "Sync__EffectivePolicy__Devices__${ANDROID_E2E_RELEASE_REGISTERED_DEVICE_ID}__ClientTransportMaxRetryCount=2" \
            "Sync__EffectivePolicy__Devices__${ANDROID_E2E_RELEASE_REGISTERED_DEVICE_ID}__ClientTransportBaseSeconds=9" \
            "Sync__EffectivePolicy__Devices__${ANDROID_E2E_RELEASE_REGISTERED_DEVICE_ID}__LocalSuccessHours=12" \
            "Sync__EffectivePolicy__Devices__${ANDROID_E2E_RELEASE_REGISTERED_DEVICE_ID}__LocalRejectedDays=3" \
            "Sync__EffectivePolicy__Devices__${ANDROID_E2E_RELEASE_REGISTERED_DEVICE_ID}__ServerPayloadDays=30" \
            "Sync__EffectivePolicy__Devices__${ANDROID_E2E_RELEASE_REGISTERED_DEVICE_ID}__CacheMaxAgeHours=1" \
            dotnet TransportERP.Api/bin/Release/net10.0/TransportERP.Api.dll \
            > "$RUNNER_TEMP/android-e2e-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/android-e2e-api.pid"
          rm -f "$RUNNER_TEMP/android-release-signer-sha256.txt"
          unset release_signer_sha
          ready=false
          for attempt in $(seq 1 90); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --cacert "$tls_dir/server.crt" \
              https://localhost:8443/api/v1/sync/activation || true)
            if [ "$status" = 401 ]; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true

      - name: Run ordinary Android Release UI E2E and same-binary restart proof
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          release_apk=ci-evidence/android-runtime/TransportERP.Mobile.Driver.Release.apk
          release_input="$RUNNER_TEMP/android-release-e2e-input.json"
          evidence=ci-evidence/android-runtime/release-ui-e2e.json
          test -f "$release_apk" && test -f "$release_input"
          expected_sha=$(sha256sum "$release_apk" | awk '{print $1}')
          test "$expected_sha" = "$ANDROID_E2E_RELEASE_ARTIFACT_SHA"
          adb uninstall "$ANDROID_TEST_PACKAGE" >/dev/null
          adb install "$release_apk"
          installed_path=$(adb shell pm path "$ANDROID_TEST_PACKAGE" | tr -d '\r' | sed -n 's/^package://p')
          test -n "$installed_path"
          installed_sha=$(adb exec-out cat "$installed_path" | sha256sum | awk '{print $1}')
          test "$installed_sha" = "$expected_sha"
          python3 eng/ci/android_release_ui_e2e.py \
            --input "$release_input" \
            --evidence "$evidence" \
            --package "$ANDROID_TEST_PACKAGE" \
            --timeout-seconds 300
          python3 - "$evidence" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "schemaVersion": 1,
              "activity": "ordinary-launcher",
              "nonDebuggableRelease": True,
              "closedDefault": True,
              "authenticatedActivation": True,
              "businessOperationQueued": True,
              "businessOperationSucceeded": True,
              "persistedAfterReleaseRestart": True,
              "signedOutClosed": True,
          }
          if result != expected:
              raise SystemExit("Android Release UI evidence is incomplete or unexpected.")
          PY
          installed_path_after=$(adb shell pm path "$ANDROID_TEST_PACKAGE" | tr -d '\r' | sed -n 's/^package://p')
          test "$installed_path_after" = "$installed_path"
          test "$(adb exec-out cat "$installed_path_after" | sha256sum | awk '{print $1}')" = "$expected_sha"
          {
            echo "release_apk_sha256=$expected_sha"
            echo "installed_apk_sha256=$installed_sha"
            echo 'release_ui_e2e=PASS'
            echo 'same_release_binary_after_restart=true'
            echo 'application_certificate_bypass=false'
          } > ci-evidence/android-runtime/release-runtime-identity.txt

      - name: Capture sanitized Android PostgreSQL diagnostics
        if: ${{ always() }}
        shell: bash
        env:
          PGPASSWORD: android-ci-database-password
        run: |
          mkdir -p ci-evidence/android-runtime
          diagnostic=ci-evidence/android-runtime/business-postgresql-diagnostics.txt
          if ! psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc 'SELECT 1' >/dev/null 2>&1; then
            echo 'postgresql_diagnostics=unavailable' > "$diagnostic"
            exit 0
          fi
          schema_ready=$(psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
            "SELECT CASE WHEN to_regclass('transport_erp.sync_operations') IS NULL THEN 0 ELSE 1 END")
          if [ "$schema_ready" != 1 ]; then
            echo 'postgresql_diagnostics=schema_unavailable' > "$diagnostic"
            exit 0
          fi
          {
            echo 'schema_version=1'
            echo 'scope=devices:android-ci-device,android-ci-release-device;action:CreateOperationalParty'
            psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
              "WITH buckets(status) AS (VALUES ('QUEUED'),('SENDING'),('FAILED'),('REJECTED'),('SUCCEEDED')), scoped AS (SELECT o.\"Status\" FROM transport_erp.sync_operations o WHERE o.\"ActionCode\"='CreateOperationalParty' AND o.\"RegisteredDeviceId\" IN (SELECT d.\"Id\" FROM transport_erp.registered_devices d WHERE d.\"DeviceId\" IN ('android-ci-device','android-ci-release-device'))) SELECT 'status_bucket=' || b.status || ';count=' || count(s.\"Status\") FROM buckets b LEFT JOIN scoped s ON s.\"Status\"=b.status GROUP BY b.status ORDER BY b.status"
            psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
              "SELECT 'status_bucket=ABSENT;count=' || CASE WHEN EXISTS (SELECT 1 FROM transport_erp.sync_operations o WHERE o.\"ActionCode\"='CreateOperationalParty' AND o.\"RegisteredDeviceId\" IN (SELECT d.\"Id\" FROM transport_erp.registered_devices d WHERE d.\"DeviceId\" IN ('android-ci-device','android-ci-release-device'))) THEN 0 ELSE 1 END"
            psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
              "SELECT 'nonce_count=' || count(*) FROM transport_erp.sync_proof_nonces WHERE \"DeviceId\" IN ('android-ci-device','android-ci-release-device')"
            psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
              "SELECT 'replay_count=' || count(*) FROM transport_erp.sync_proof_replays r JOIN transport_erp.sync_proof_nonces n ON n.\"Id\" = r.\"NonceRecordId\" WHERE r.\"DeviceId\" IN ('android-ci-device','android-ci-release-device')"
            psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
              "SELECT 'audit_action=' || \"Action\" || ';count=' || count(*) FROM transport_erp.audit_events WHERE \"OperationCorrelationId\" IN (SELECT \"OperationCorrelationId\" FROM transport_erp.sync_operations WHERE \"ActionCode\" = 'CreateOperationalParty' AND \"RegisteredDeviceId\" IN (SELECT \"Id\" FROM transport_erp.registered_devices WHERE \"DeviceId\" IN ('android-ci-device','android-ci-release-device'))) GROUP BY \"Action\" ORDER BY \"Action\""
          } > "$diagnostic"

      - name: Verify Android business result in PostgreSQL 18.6
        shell: bash
        env:
          PGPASSWORD: android-ci-database-password
        run: |
          set -euo pipefail
          server_version=$(psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
            'SHOW server_version')
          server_version_num=$(psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
            'SHOW server_version_num')
          test "$server_version_num" = '180006'
          native_sync_succeeded=$(psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
            'SELECT count(*) FROM transport_erp.sync_operations o JOIN transport_erp.registered_devices d ON d."Id"=o."RegisteredDeviceId" WHERE d."DeviceId"='\''android-ci-device'\'' AND o."ActionCode"='\''CreateOperationalParty'\'' AND o."Status"='\''SUCCEEDED'\''')
          release_sync_succeeded=$(psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
            'SELECT count(*) FROM transport_erp.sync_operations o JOIN transport_erp.registered_devices d ON d."Id"=o."RegisteredDeviceId" WHERE d."DeviceId"='\''android-ci-release-device'\'' AND o."ActionCode"='\''CreateOperationalParty'\'' AND o."Status"='\''SUCCEEDED'\''')
          native_party_created=$(psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
            'SELECT count(*) FROM transport_erp.operational_parties WHERE "Name" = '\''Android CI E2E Party'\''')
          release_party_created=$(psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
            'SELECT count(*) FROM transport_erp.operational_parties WHERE "Name" LIKE '\''UIE2E-%'\''')
          for device_id in android-ci-device android-ci-release-device; do
            proof_bound=$(psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
              "SELECT count(*) FROM transport_erp.registered_devices WHERE \"DeviceId\"='$device_id' AND \"ProofKeyVersion\"=1 AND \"ProofKeyThumbprint\" IS NOT NULL")
            nonce_proof_accepted=$(psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
              "SELECT count(*) FROM transport_erp.sync_proof_replays r WHERE r.\"DeviceId\"='$device_id' AND r.\"ProofKeyVersion\"=1")
            operation_proof_bound=$(psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
              "SELECT count(*) FROM transport_erp.sync_operations o JOIN transport_erp.registered_devices d ON d.\"Id\"=o.\"RegisteredDeviceId\" WHERE d.\"DeviceId\"='$device_id' AND o.\"ActionCode\"='CreateOperationalParty' AND o.\"ProofKeyVersion\"=1 AND o.\"ProofKeyThumbprint\" IS NOT NULL AND o.\"AcceptedProofReplayId\" IS NOT NULL")
            queued_audit=$(psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
              "SELECT count(*) FROM transport_erp.audit_events WHERE \"Action\"='SyncOperationQueued' AND \"OperationCorrelationId\" IN (SELECT o.\"OperationCorrelationId\" FROM transport_erp.sync_operations o JOIN transport_erp.registered_devices d ON d.\"Id\"=o.\"RegisteredDeviceId\" WHERE d.\"DeviceId\"='$device_id' AND o.\"ActionCode\"='CreateOperationalParty')")
            dispatch_audit=$(psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
              "SELECT count(*) FROM transport_erp.audit_events WHERE \"Action\"='SyncBusinessDispatchAttempt' AND \"OperationCorrelationId\" IN (SELECT o.\"OperationCorrelationId\" FROM transport_erp.sync_operations o JOIN transport_erp.registered_devices d ON d.\"Id\"=o.\"RegisteredDeviceId\" WHERE d.\"DeviceId\"='$device_id' AND o.\"ActionCode\"='CreateOperationalParty')")
            succeeded_audit=$(psql -h 127.0.0.1 -U transporter_android_ci -d transporter_android_ci -Atc \
              "SELECT count(*) FROM transport_erp.audit_events WHERE \"Action\"='SyncOperationExecutionSucceeded' AND \"OperationCorrelationId\" IN (SELECT o.\"OperationCorrelationId\" FROM transport_erp.sync_operations o JOIN transport_erp.registered_devices d ON d.\"Id\"=o.\"RegisteredDeviceId\" WHERE d.\"DeviceId\"='$device_id' AND o.\"ActionCode\"='CreateOperationalParty')")
            test "$proof_bound" = 1
            test "$nonce_proof_accepted" -ge 1
            test "$operation_proof_bound" = 1
            test "$queued_audit" = 1
            test "$dispatch_audit" = 1
            test "$succeeded_audit" = 1
          done
          test "$native_sync_succeeded" = 1
          test "$release_sync_succeeded" = 1
          test "$native_party_created" = 1
          test "$release_party_created" = 1
          python3 - <<'PY'
          import json
          with open('TransportERP.Api/appsettings.json', encoding='utf-8') as stream:
              settings = json.load(stream)
          if settings['Sync']['Offline']['Enabled'] is not False:
              raise SystemExit('Production Offline default changed during Android E2E.')
          PY
          {
            echo 'postgresql_image=postgres:18.6-bookworm'
            echo "postgresql_server_version=$server_version"
            echo "postgresql_server_version_num=$server_version_num"
            echo 'device_proof_key_bound=true'
            echo 'nonce_signed_proof_accepted=true'
            echo 'operation_bound_to_accepted_proof=true'
            echo 'sync_queued_audit_persisted=true'
            echo 'sync_dispatch_audit_persisted=true'
            echo 'sync_succeeded_audit_persisted=true'
            echo 'sync_operation_succeeded=true'
            echo 'native_operational_party_created=true'
            echo 'release_operational_party_created=true'
            echo 'production_offline_default=false'
          } > ci-evidence/android-runtime/business-postgresql-evidence.txt

      - name: Attest exact Android device-test APK provenance
        id: attest-android-runtime
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ci-evidence/android-runtime/TransportERP.Mobile.Driver.DeviceTests.apk
          predicate-type: https://github.com/shfeekalbhure/TransportERP/attestations/build-identity/v1
          predicate-path: ci-evidence/android-runtime/build-identity-predicate.json

      - name: Persist Android device-test attestation evidence
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          PREDICATE_TYPE: https://github.com/shfeekalbhure/TransportERP/attestations/build-identity/v1
        run: |
          set -euo pipefail
          bundle='${{ steps.attest-android-runtime.outputs.bundle-path }}'
          test -n "$bundle" && test -f "$bundle"
          cp -- "$bundle" ci-evidence/android-runtime/provenance-attestation.json
          gh attestation verify ci-evidence/android-runtime/TransportERP.Mobile.Driver.DeviceTests.apk \
            --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type "$PREDICATE_TYPE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-digest "$EXPECTED_SHA" \
            --source-ref "$GITHUB_REF" \
            --format json \
            > ci-evidence/android-runtime/provenance-verification.json
          python3 - "$EXPECTED_SHA" "$PREDICATE_TYPE" \
            ci-evidence/android-runtime/build-identity-predicate.json \
            ci-evidence/android-runtime/provenance-verification.json <<'PY'
          import json, pathlib, sys
          expected_sha, predicate_type, predicate_path, verification_path = sys.argv[1:]
          expected = json.loads(pathlib.Path(predicate_path).read_text(encoding="utf-8"))
          results = json.loads(pathlib.Path(verification_path).read_text(encoding="utf-8"))
          matches = [entry for entry in results
                     if entry.get("verificationResult", {}).get("statement", {}).get("predicateType") == predicate_type
                     and entry.get("verificationResult", {}).get("statement", {}).get("predicate") == expected]
          if len(matches) != 1 or expected.get("sourceSha") != expected_sha:
              raise SystemExit("Verified Android device-test attestation is not bound to the exact candidate predicate.")
          PY
          echo 'attestation_verification=PASS' > ci-evidence/android-runtime/provenance-verification.txt
          {
            echo 'attestation_provider=github-oidc-sigstore'
            echo 'attestation_id=${{ steps.attest-android-runtime.outputs.attestation-id }}'
            echo 'attestation_url=${{ steps.attest-android-runtime.outputs.attestation-url }}'
          } > ci-evidence/android-runtime/provenance-attestation.txt

      - name: Capture sanitized Android crash diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p ci-evidence/android-runtime
          if adb get-state >/dev/null 2>&1; then
            adb logcat -d -v brief \
              | { grep -E 'AndroidRuntime|monodroid|DOTNET|libc|com\.transporterp\.mobile\.driver' || true; } \
              | tail -n 600 \
              > ci-evidence/android-runtime/android-runtime-errors.txt
            adb shell dumpsys activity exit-info "$ANDROID_TEST_PACKAGE" \
              > ci-evidence/android-runtime/android-process-exit-info.txt
          else
            echo 'android_device_state=unavailable_before_emulator_start' \
              > ci-evidence/android-runtime/android-runtime-errors.txt
            echo 'android_process_exit_info=unavailable_before_emulator_start' \
              > ci-evidence/android-runtime/android-process-exit-info.txt
          fi
          cat ci-evidence/android-runtime/android-runtime-errors.txt
          sed -n '1,240p' ci-evidence/android-runtime/android-process-exit-info.txt
          if [ -f "$RUNNER_TEMP/android-e2e-api.log" ]; then
            grep -oE '(APPLICATION_|DEVICE_|OFFLINE_|SYNC_|PROOF_|PAYLOAD_|RUNTIME_)[A-Z0-9_]+' \
              "$RUNNER_TEMP/android-e2e-api.log" \
              | sort -u | tail -n 300 > ci-evidence/android-runtime/api-errors-sanitized.txt || true
          fi

      - name: Write Android exact-head evidence manifest
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p ci-evidence/android-runtime
          actual=$(git rev-parse HEAD 2>/dev/null || echo unavailable)
          tree=$(git rev-parse HEAD^{tree} 2>/dev/null || echo unavailable)
          {
            echo "workflow=$GITHUB_WORKFLOW"
            echo 'job=android-device-runtime'
            echo "event=$GITHUB_EVENT_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "job_status=$JOB_STATUS"
            echo "ref=$GITHUB_REF"
            echo "expected_sha=$EXPECTED_SHA"
            echo "actual_sha=$actual"
            echo "tree_sha=$tree"
            echo 'runner=ubuntu-24.04-x64'
            echo 'system_image=android-35-google_apis-x86_64'
            echo 'production_offline_default=false'
            echo 'ci_test_runtime_activated=true'
          } > ci-evidence/android-runtime/exact-head-manifest.txt
          test "$actual" = "$EXPECTED_SHA"

      - name: Clear Android device-test credentials and sandbox
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/android-e2e-input.json" \
            "$RUNNER_TEMP/android-release-e2e-input.json" \
