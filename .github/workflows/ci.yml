name: CI

on:
  push:
    branches:
      - master
      - codex/p1-security-device-sync-offline-20260825
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-postgresql:
    name: Required CI / Core + PostgreSQL + HTTP
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transporterptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d transporterptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TRANSPORTERP_DESIGN_CONNSTR: Host=localhost;Port=5432;Database=transporterptest;Username=postgres;Password=postgres
      TRANSPORTERP_TEST_CONNSTR: Host=localhost;Port=5432;Database=transporterptest;Username=postgres;Password=postgres
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          echo "actual=$actual"
          echo "expected=$expected"
          test "$actual" = "$expected" || { echo 'Core job is not running on the exact PR head.'; exit 1; }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Validate P0 and P1 contracts
        run: python documentation/closeout/validate_p0_p1.py

      - name: Validate closed P2-C01 contracts
        run: python documentation/closeout/P2/validate_p2_c01_contracts.py

      - name: Restore core tests
        run: dotnet restore TransportERP.Tests/TransportERP.Tests.csproj

      - name: Build core runtime and tests
        run: dotnet build TransportERP.Tests/TransportERP.Tests.csproj --configuration Release --no-restore -p:TransportERPImplementationSha="$EXPECTED_SHA"

      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.0

      - name: Verify EF model matches committed migrations
        run: dotnet ef migrations has-pending-model-changes --configuration Release --no-build --project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj --startup-project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj

      - name: Apply committed migrations to PostgreSQL 18
        run: dotnet ef database update --configuration Release --no-build --project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj --startup-project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj

      - name: Run client producer E2E acceptance gate
        run: dotnet test TransportERP.Tests/TransportERP.Tests.csproj --configuration Release --no-build --filter "Acceptance=CLIENT-PRODUCER-E2E" --logger "trx;LogFileName=ci-client-producer-e2e.trx" -p:TransportERPImplementationSha="$EXPECTED_SHA"

      - name: Verify client producer E2E was executed and not skipped
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path("TransportERP.Tests/TestResults").rglob("ci-client-producer-e2e.trx"))
          if len(reports) != 1:
              raise SystemExit(f"Expected exactly one CLIENT-PRODUCER-E2E TRX report, found {len(reports)}.")
          counters = ET.parse(reports[0]).getroot().find(".//{*}Counters")
          if counters is None:
              raise SystemExit("CLIENT-PRODUCER-E2E TRX report has no counters.")
          total = int(counters.attrib.get("total", "0"))
          passed = int(counters.attrib.get("passed", "0"))
          failed = int(counters.attrib.get("failed", "0"))
          not_executed = int(counters.attrib.get("notExecuted", "0"))
          if total < 1 or passed != total or failed != 0 or not_executed != 0:
              raise SystemExit(
                  "CLIENT-PRODUCER-E2E did not execute fail-closed: "
                  f"total={total}, passed={passed}, failed={failed}, notExecuted={not_executed}."
              )
          print(f"CLIENT-PRODUCER-E2E executed: total={total}, passed={passed}, skipped={not_executed}")
          PY

      - name: Run the complete test suite fail-closed
        run: dotnet test TransportERP.Tests/TransportERP.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=ci-all-tests.trx" -p:TransportERPImplementationSha="$EXPECTED_SHA"

      - name: Verify the complete test suite executed with no skips
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path("TransportERP.Tests/TestResults").rglob("ci-all-tests.trx"))
          if len(reports) != 1:
              raise SystemExit(f"Expected exactly one full-suite TRX report, found {len(reports)}.")
          counters = ET.parse(reports[0]).getroot().find(".//{*}Counters")
          if counters is None:
              raise SystemExit("Full-suite TRX report has no counters.")
          total = int(counters.attrib.get("total", "0"))
          passed = int(counters.attrib.get("passed", "0"))
          failed = int(counters.attrib.get("failed", "0"))
          not_executed = int(counters.attrib.get("notExecuted", "0"))
          if total < 1 or passed != total or failed != 0 or not_executed != 0:
              raise SystemExit(
                  "Full suite did not execute fail-closed: "
                  f"total={total}, passed={passed}, failed={failed}, notExecuted={not_executed}."
              )
          print(f"Full suite executed: total={total}, passed={passed}, skipped={not_executed}")
          PY

      - name: Write exact-head evidence manifest
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p ci-evidence/core
          actual=$(git rev-parse HEAD 2>/dev/null || echo unavailable)
          tree=$(git rev-parse HEAD^{tree} 2>/dev/null || echo unavailable)
          {
            echo "workflow=$GITHUB_WORKFLOW"
            echo "job=core-postgresql"
            echo "event=$GITHUB_EVENT_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "job_status=$JOB_STATUS"
            echo "ref=$GITHUB_REF"
            echo "expected_sha=$EXPECTED_SHA"
            echo "actual_sha=$actual"
            echo "tree_sha=$tree"
          } > ci-evidence/core/exact-head-manifest.txt
          test "$actual" = "$EXPECTED_SHA"

      - name: Upload core CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-core-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ci-evidence/core/exact-head-manifest.txt
            TransportERP.Tests/TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 30

  desktop-contract:
    # This display name is the exact required status context configured by the
    # master ruleset. Changing it requires a coordinated ruleset update.
    name: Required CI / Desktop RTL contract surface
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $expected = '${{ github.event.pull_request.head.sha }}'
          } else {
            $expected = '${{ github.sha }}'
          }
          Write-Host "actual=$actual"
          Write-Host "expected=$expected"
          if ($actual -ne $expected) { throw 'Desktop job is not running on the exact PR head.' }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Restore Desktop
        run: dotnet restore TransportERP.Desktop/TransportERP.Desktop.csproj

      - name: Build Desktop executable
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          dotnet build TransportERP.Desktop/TransportERP.Desktop.csproj `
            --configuration Release `
            --no-restore `
            -p:ContinuousIntegrationBuild=true `
            -p:SourceRevisionId="$env:EXPECTED_SHA" `
            -p:TransportERPImplementationSha="$env:EXPECTED_SHA" `
            -p:TransportERPClientPublicOrigin=https://127.0.0.1:55443/

      - name: Bind Desktop binary evidence to exact source SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $output = 'TransportERP.Desktop/bin/Release/net10.0-windows'
          $executable = Join-Path $output 'TransportERP.Desktop.exe'
          $assembly = Join-Path $output 'TransportERP.Desktop.dll'
          $applicationAssembly = Join-Path $output 'TransportERP.Application.dll'
          if (-not (Test-Path $executable)) { throw 'Desktop WinExe artifact was not produced.' }
          if (-not (Test-Path $assembly)) { throw 'Desktop managed assembly was not produced.' }
          if (-not (Test-Path $applicationAssembly)) { throw 'Governed application assembly was not produced.' }

          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw 'Desktop binary was built from a non-candidate SHA.' }
          $productVersion = (Get-Item $assembly).VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($productVersion) -or -not $productVersion.Contains($env:EXPECTED_SHA)) {
            throw 'Desktop binary identity is not bound to the candidate source SHA.'
          }
          $governedAssembly = [System.Reflection.Assembly]::LoadFrom((Resolve-Path $applicationAssembly).Path)
          $implementationSha = $governedAssembly.GetCustomAttributes([System.Reflection.AssemblyMetadataAttribute], $false) |
            Where-Object Key -eq 'TransportERPImplementationSha' |
            Select-Object -ExpandProperty Value -First 1
          if ($implementationSha -ne $env:EXPECTED_SHA) {
            throw 'Desktop governed implementation metadata is unbound or does not match the candidate source SHA.'
          }

          New-Item -ItemType Directory -Force -Path 'ci-evidence/desktop' | Out-Null
          @(
            'schema_version=1'
            "source_sha=$actual"
            "tree_sha=$((& git rev-parse 'HEAD^{tree}').Trim())"
            "assembly_product_version=$productVersion"
            "implementation_sha=$implementationSha"
            "executable_sha256=$((Get-FileHash -Algorithm SHA256 $executable).Hash.ToLowerInvariant())"
            "assembly_sha256=$((Get-FileHash -Algorithm SHA256 $assembly).Hash.ToLowerInvariant())"
            "application_assembly_sha256=$((Get-FileHash -Algorithm SHA256 $applicationAssembly).Hash.ToLowerInvariant())"
          ) | Set-Content -Encoding utf8 'ci-evidence/desktop/build-identity.txt'

      - name: Measure the exact Desktop deployment with the candidate WinExe
        shell: pwsh
        run: |
          $executable = (Resolve-Path 'TransportERP.Desktop/bin/Release/net10.0-windows/TransportERP.Desktop.exe').Path
          $identityPath = Join-Path (Resolve-Path 'ci-evidence/desktop').Path 'runtime-build-identity.json'
          if (Test-Path $identityPath) { throw 'Desktop runtime build identity output already exists.' }
          $process = Start-Process -FilePath $executable `
            -ArgumentList @('--print-build-identity', $identityPath) `
            -PassThru -Wait
          if ($process.ExitCode -ne 0 -or -not (Test-Path $identityPath)) {
            throw 'The candidate WinExe did not measure its own deployment successfully.'
          }
          $identity = Get-Content -Raw $identityPath | ConvertFrom-Json
          if ($identity.platform -ne 'desktop-windows' -or
              $identity.artifactSha256 -notmatch '^[0-9a-f]{64}$' -or
              ($null -ne $identity.signerCertificateSha256 -and
               $identity.signerCertificateSha256 -notmatch '^[0-9a-f]{64}$')) {
            throw 'The candidate WinExe returned an invalid build identity.'
          }
          $independentDigest = (python eng/ci/verify_desktop_build_identity.py `
            --root 'TransportERP.Desktop/bin/Release/net10.0-windows' `
            --identity $identityPath).Trim()
          if ($LASTEXITCODE -ne 0 -or $independentDigest -ne $identity.artifactSha256) {
            throw 'Independent Desktop deployment-tree verification failed.'
          }
          @(
            "deployment_tree_sha256=$($identity.artifactSha256)"
            "independent_deployment_tree_sha256=$independentDigest"
            "signer_certificate_sha256=$($identity.signerCertificateSha256)"
          ) | Add-Content -Encoding utf8 'ci-evidence/desktop/build-identity.txt'

      - name: Run Desktop closed-default startup smoke
        shell: pwsh
        run: |
          $executable = 'TransportERP.Desktop/bin/Release/net10.0-windows/TransportERP.Desktop.exe'
          $runtimeConfig = 'TransportERP.Desktop/bin/Release/net10.0-windows/TransportERP.Desktop.runtimeconfig.json'
          if (-not (Test-Path $executable)) { throw 'Desktop WinExe artifact was not produced.' }
          if (-not (Test-Path $runtimeConfig)) { throw 'Desktop runtime configuration was not produced.' }
          $process = Start-Process -FilePath $executable -ArgumentList '--startup-smoke' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Desktop startup smoke did not remain fail-closed.' }

      - name: Run Desktop Windows runtime platform smoke
        shell: pwsh
        run: |
          $executable = 'TransportERP.Desktop/bin/Release/net10.0-windows/TransportERP.Desktop.exe'
          $buildIdentity = 'ci-evidence/desktop/build-identity.txt'
          if (-not (Test-Path $executable)) { throw 'Desktop WinExe artifact was not produced.' }
          if (-not (Test-Path $buildIdentity)) { throw 'Desktop build identity evidence was not produced.' }
          $process = Start-Process -FilePath $executable -ArgumentList '--runtime-platform-smoke' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Desktop CNG/DPAPI/SQLCipher/restart runtime platform smoke failed at checkpoint $($process.ExitCode)."
          }
          'runtime_platform_smoke=PASS' | Add-Content -Encoding utf8 $buildIdentity

      - name: Provision pinned PostgreSQL 18.6 for Desktop E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '18.6-1'
          $expectedArchiveSha256 = 'fbe23da234ee31547bf8a36d29dfd81e82b849df2d2b78d2eecb43d360252f8c'
          $archive = Join-Path $env:RUNNER_TEMP "postgresql-$version-windows-x64-binaries.zip"
          $install = Join-Path $env:RUNNER_TEMP "postgresql-$version"
          $data = Join-Path $env:RUNNER_TEMP 'transporterp-desktop-postgresql-data'
          $log = Join-Path $env:RUNNER_TEMP 'transporterp-desktop-postgresql.log'
          $uri = "https://get.enterprisedb.com/postgresql/postgresql-$version-windows-x64-binaries.zip"

          Invoke-WebRequest -Uri $uri -OutFile $archive
          $archiveSha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($archiveSha256 -ne $expectedArchiveSha256) {
            throw 'The pinned PostgreSQL 18.6 archive hash did not match.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $install
          $bin = Join-Path $install 'pgsql/bin'
          $postgres = Join-Path $bin 'postgres.exe'
          $initdb = Join-Path $bin 'initdb.exe'
          $pgCtl = Join-Path $bin 'pg_ctl.exe'
          $createdb = Join-Path $bin 'createdb.exe'
          $pgIsReady = Join-Path $bin 'pg_isready.exe'
          foreach ($required in @($postgres, $initdb, $pgCtl, $createdb, $pgIsReady)) {
            if (-not (Test-Path $required)) { throw 'The pinned PostgreSQL archive is incomplete.' }
          }
          $postgresVersion = (& $postgres --version).Trim()
          if ($postgresVersion -ne 'postgres (PostgreSQL) 18.6') {
            throw "Expected PostgreSQL 18.6; actual version was $postgresVersion."
          }

          & $initdb -D $data -U postgres --auth-host=trust --auth-local=trust --encoding=UTF8 --no-locale
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL initdb failed.' }
          & $pgCtl -D $data -l $log -o "-p 55432 -h 127.0.0.1" start
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL server startup failed.' }
          & $pgIsReady -h 127.0.0.1 -p 55432 -U postgres
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL did not become ready.' }
          & $createdb -h 127.0.0.1 -p 55432 -U postgres transporterptest
          if ($LASTEXITCODE -ne 0) { throw 'Desktop E2E database creation failed.' }

          New-Item -ItemType Directory -Force -Path 'ci-evidence/desktop' | Out-Null
          @(
            "postgres_archive_sha256=$archiveSha256"
            "postgres_version=$postgresVersion"
          ) | Set-Content -Encoding utf8 'ci-evidence/desktop/postgresql-identity.txt'
          "DESKTOP_E2E_POSTGRES_BIN=$bin" | Add-Content -Encoding utf8 $env:GITHUB_ENV
          "DESKTOP_E2E_POSTGRES_DATA=$data" | Add-Content -Encoding utf8 $env:GITHUB_ENV
          "DESKTOP_E2E_POSTGRES_LOG=$log" | Add-Content -Encoding utf8 $env:GITHUB_ENV
          'TRANSPORTERP_TEST_CONNSTR=Host=127.0.0.1;Port=55432;Database=transporterptest;Username=postgres' |
            Add-Content -Encoding utf8 $env:GITHUB_ENV

      - name: Restore and build Desktop E2E
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          dotnet restore TransportERP.Desktop.E2ETests/TransportERP.Desktop.E2ETests.csproj
          dotnet build TransportERP.Desktop.E2ETests/TransportERP.Desktop.E2ETests.csproj `
            --configuration Release `
            --no-restore `
            -p:ContinuousIntegrationBuild=true `
            -p:SourceRevisionId="$env:EXPECTED_SHA" `
            -p:TransportERPImplementationSha="$env:EXPECTED_SHA" `
            -p:TransportERPClientPublicOrigin=https://127.0.0.1:55443/

      - name: Freeze the Desktop deployment identity after the final build
        shell: pwsh
        run: |
          $deployment = 'TransportERP.Desktop/bin/Release/net10.0-windows'
          $executable = (Resolve-Path (Join-Path $deployment 'TransportERP.Desktop.exe')).Path
          $identityPath = Join-Path (Resolve-Path 'ci-evidence/desktop').Path 'runtime-build-identity-final.json'
          if (Test-Path $identityPath) { throw 'Final Desktop runtime build identity already exists.' }
          $process = Start-Process -FilePath $executable `
            -ArgumentList @('--print-build-identity', $identityPath) `
            -PassThru -Wait
          if ($process.ExitCode -ne 0 -or -not (Test-Path $identityPath)) {
            throw 'The final candidate WinExe did not measure its deployment.'
          }
          $identity = Get-Content -Raw $identityPath | ConvertFrom-Json
          $independentDigest = (python eng/ci/verify_desktop_build_identity.py `
            --root $deployment --identity $identityPath).Trim()
          if ($LASTEXITCODE -ne 0 -or $independentDigest -ne $identity.artifactSha256) {
            throw 'Final Desktop deployment-tree verification failed.'
          }
          $initial = Get-Content -Raw 'ci-evidence/desktop/runtime-build-identity.json' | ConvertFrom-Json
          if ($initial.platform -ne $identity.platform -or
              $initial.artifactSha256 -ne $identity.artifactSha256 -or
              $initial.signerCertificateSha256 -ne $identity.signerCertificateSha256) {
            throw 'The Desktop deployment changed after its initial identity measurement.'
          }
          "final_deployment_tree_sha256=$independentDigest" |
            Add-Content -Encoding utf8 'ci-evidence/desktop/build-identity.txt'

      - name: Run true Desktop CNG DPAPI SQLCipher HTTP PostgreSQL E2E
        timeout-minutes: 35
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $testClass = 'TransportERP.Desktop.E2ETests.DesktopProductionEndToEndPostgreSqlTests'
          $testMethods = @(
            'Measured_deployment_tree_changes_when_any_binary_changes'
            'WinExe_writes_its_measured_build_identity_to_an_explicit_new_file'
            'Release_WinExe_starts_closed_and_is_driven_through_stable_UI_Automation_ids'
            'Same_release_WinExe_UI_Kestrel_SQLCipher_worker_and_PostgreSql_succeed'
            'Authenticated_producer_CNG_DPAPI_SQLCipher_HTTP_worker_PostgreSql_and_restart_succeed'
          )
          $resultsRoot = 'TransportERP.Desktop.E2ETests/TestResults/ci-isolated'
          if (Test-Path $resultsRoot) {
            throw 'The isolated Desktop E2E results directory already exists.'
          }
          New-Item -ItemType Directory -Force -Path $resultsRoot | Out-Null
          $checkpointFile = Join-Path $env:RUNNER_TEMP 'desktop-release-e2e-checkpoints.txt'
          if (Test-Path $checkpointFile) {
            throw 'The Desktop E2E checkpoint file already exists.'
          }
          $env:TRANSPORTERP_DESKTOP_E2E_CHECKPOINT_FILE = $checkpointFile

          $failures = [System.Collections.Generic.List[string]]::new()
          for ($index = 0; $index -lt $testMethods.Count; $index++) {
            $fullyQualifiedName = "$testClass.$($testMethods[$index])"
            $reportName = 'ci-desktop-e2e-{0:d2}.trx' -f ($index + 1)
            $arguments = @(
              'test'
              'TransportERP.Desktop.E2ETests/TransportERP.Desktop.E2ETests.csproj'
              '--configuration'
              'Release'
              '--no-build'
              '--filter'
              "FullyQualifiedName=$fullyQualifiedName"
              '--logger'
              "trx;LogFileName=$reportName"
              '--results-directory'
              $resultsRoot
              "-p:TransportERPImplementationSha=$env:EXPECTED_SHA"
            )

            Write-Host "Running isolated Desktop E2E $($index + 1)/$($testMethods.Count): $fullyQualifiedName"
            try {
              $process = Start-Process -FilePath 'dotnet' -ArgumentList $arguments `
                -PassThru -NoNewWindow
            }
            catch {
              $failures.Add("$fullyQualifiedName could not start: $($_.Exception.GetType().Name).")
              break
            }

            $completed = $process.WaitForExit(300000)
            if (-not $completed) {
              $failures.Add("$fullyQualifiedName exceeded its five-minute timeout.")
              $taskKill = Start-Process `
                -FilePath (Join-Path $env:SystemRoot 'System32/taskkill.exe') `
                -ArgumentList @('/PID', "$($process.Id)", '/T', '/F') `
                -PassThru -NoNewWindow
              $taskKillCompleted = $taskKill.WaitForExit(30000)
              if (-not $taskKillCompleted) {
                try { $taskKill.Kill($true) } catch { }
                $failures.Add("$fullyQualifiedName taskkill command timed out.")
              }
              $process.Refresh()
              if ($taskKillCompleted -and $taskKill.ExitCode -ne 0 -and -not $process.HasExited) {
                $failures.Add("$fullyQualifiedName process tree could not be terminated.")
              }
              if (-not $process.HasExited) {
                try { $process.Kill($true) }
                catch {
                  $failures.Add(
                    "$fullyQualifiedName fallback termination failed: " +
                    "$($_.Exception.GetType().Name).")
                }
              }
              if (-not $process.HasExited -and -not $process.WaitForExit(30000)) {
                $failures.Add("$fullyQualifiedName remained alive after termination attempts.")
              }
              break
            }

            if ($process.ExitCode -ne 0) {
              $failures.Add("$fullyQualifiedName exited with code $($process.ExitCode).")
              break
            }
          }

          $allowedCheckpoints = @(
            'START'
            'CERTIFICATE_CREATED'
            'PROOF_READ'
            'MIGRATIONS_APPLIED'
            'SCOPE_SEEDED'
            'LOCAL_ROOT_RESET'
            'HOST_CONFIGURATION_READY'
            'API_READY'
            'DESKTOP_LAUNCHED'
            'SIGNED_IN'
            'OPERATION_QUEUED'
            'SERVER_OPERATION_SUCCEEDED'
            'DESKTOP_CLOSED'
            'DESKTOP_RESTARTED'
            'RESTART_SIGNED_IN'
            'PERSISTED_OPERATION_VERIFIED'
            'RESTART_CLOSED'
            'ENCRYPTED_OUTBOX_VERIFIED'
            'DATABASE_EVIDENCE_VERIFIED'
            'CLEANUP_COMPLETED'
            'HOST_START'
            'HOST_LOOPBACK_CHECK_STARTED'
            'HOST_LOOPBACK_CHECK_COMPLETED'
            'HOST_ORIGIN_VALIDATED'
            'HOST_ENTRYPOINT_VALIDATED'
            'HOST_CERTIFICATE_CREATE_STARTED'
            'HOST_CERTIFICATE_CREATED'
            'HOST_CERTIFICATE_WRITTEN'
            'HOST_CERTIFICATE_TRUST_STARTED'
            'HOST_ROOT_STORE_CREATE_STARTED'
            'HOST_ROOT_STORE_CREATED'
            'HOST_ROOT_STORE_OPEN_STARTED'
            'HOST_ROOT_STORE_OPENED'
            'HOST_PUBLIC_CERTIFICATE_EXPORT_STARTED'
            'HOST_PUBLIC_CERTIFICATE_EXPORTED'
            'HOST_PUBLIC_CERTIFICATE_CREATE_STARTED'
            'HOST_PUBLIC_CERTIFICATE_CREATED'
            'HOST_ROOT_STORE_ADD_STARTED'
            'HOST_ROOT_STORE_ADD_RETURNED'
            'HOST_PUBLIC_CERTIFICATE_DISPOSE_STARTED'
            'HOST_PUBLIC_CERTIFICATE_DISPOSED'
            'HOST_ROOT_STORE_DISPOSE_STARTED'
            'HOST_ROOT_STORE_DISPOSED'
            'HOST_CERTIFICATE_TRUSTED'
            'HOST_PROCESS_START_STARTED'
            'HOST_PROCESS_STARTED'
            'HOST_DRAINS_STARTED'
            'HOST_WAIT_READY'
            'HOST_ACTIVATION_REACHABLE'
            'HOST_READY'
            'HOST_START_CANCELLED'
            'HOST_START_FAILED'
            'HOST_DISPOSE_STARTED'
            'HOST_KILL_STARTED'
            'HOST_KILL_RETURNED'
            'HOST_PROCESS_EXITED_AFTER_KILL'
            'HOST_DRAIN_WAIT_STARTED'
            'HOST_DRAINS_CANCELLED'
            'HOST_DRAIN_WAIT_COMPLETED'
            'HOST_PROCESS_DISPOSED'
            'HOST_CERTIFICATE_REMOVE_STARTED'
            'HOST_CERTIFICATE_REMOVED'
            'HOST_TEMP_ROOT_DELETE_RETURNED'
            'HOST_DISPOSE_COMPLETED'
          )
          if (-not (Test-Path $checkpointFile -PathType Leaf)) {
            $failures.Add('The Desktop release E2E produced no checkpoint evidence.')
          }
          else {
            $checkpoints = @(Get-Content $checkpointFile)
            if ($checkpoints.Count -eq 0) {
              $failures.Add('The Desktop release E2E checkpoint evidence is empty.')
            }
            foreach ($checkpoint in $checkpoints) {
              if ($checkpoint -notin $allowedCheckpoints) {
                $failures.Add('The Desktop release E2E emitted a non-allowlisted checkpoint.')
                continue
              }
              Write-Host "Desktop release E2E checkpoint=$checkpoint"
            }
            if ($failures -notcontains 'The Desktop release E2E emitted a non-allowlisted checkpoint.') {
              Copy-Item $checkpointFile 'ci-evidence/desktop/desktop-release-e2e-checkpoints.txt'
            }
          }

          $reports = @(Get-ChildItem $resultsRoot -Recurse -Filter 'ci-desktop-e2e-*.trx')
          if ($reports.Count -ne 5) {
            $failures.Add("Expected exactly five isolated Desktop E2E TRX reports; found $($reports.Count).")
          }
          foreach ($report in $reports) {
            try {
              [xml]$trx = Get-Content -Raw $report.FullName
              $counters = $trx.SelectSingleNode("//*[local-name()='Counters']")
              if ($null -eq $counters) {
                $failures.Add("$($report.Name) has no TRX counters.")
                continue
              }
              $total = [int]$counters.total
              $passed = [int]$counters.passed
              $failed = [int]$counters.failed
              $notExecuted = [int]$counters.notExecuted
              if ($total -ne 1 -or $passed -ne 1 -or $failed -ne 0 -or $notExecuted -ne 0) {
                $failures.Add(
                  "$($report.Name) did not execute exactly once and pass: " +
                  "total=$total passed=$passed failed=$failed skipped=$notExecuted.")
              }
            }
            catch {
              $failures.Add("$($report.Name) is not a readable TRX report: $($_.Exception.GetType().Name).")
            }
          }

          if ($failures.Count -ne 0) {
            throw ("Desktop E2E isolation gate failed:`n - " + ($failures -join "`n - "))
          }
          'desktop_e2e=PASS' | Add-Content -Encoding utf8 'ci-evidence/desktop/build-identity.txt'

      - name: Reverify the Desktop deployment after E2E
        shell: pwsh
        run: |
          $deployment = 'TransportERP.Desktop/bin/Release/net10.0-windows'
          $executable = (Resolve-Path (Join-Path $deployment 'TransportERP.Desktop.exe')).Path
          $identityPath = Join-Path (Resolve-Path 'ci-evidence/desktop').Path 'runtime-build-identity-posttest.json'
          if (Test-Path $identityPath) { throw 'Post-test Desktop runtime build identity already exists.' }
          $process = Start-Process -FilePath $executable `
            -ArgumentList @('--print-build-identity', $identityPath) `
            -PassThru -Wait
          if ($process.ExitCode -ne 0 -or -not (Test-Path $identityPath)) {
            throw 'The tested candidate WinExe did not remeasure its deployment.'
          }
          $postTest = Get-Content -Raw $identityPath | ConvertFrom-Json
          $frozen = Get-Content -Raw 'ci-evidence/desktop/runtime-build-identity-final.json' |
            ConvertFrom-Json
          $independentDigest = (python eng/ci/verify_desktop_build_identity.py `
            --root $deployment --identity $identityPath).Trim()
          if ($LASTEXITCODE -ne 0 -or $independentDigest -ne $postTest.artifactSha256 -or
              $postTest.platform -ne $frozen.platform -or
              $postTest.artifactSha256 -ne $frozen.artifactSha256 -or
              $postTest.signerCertificateSha256 -ne $frozen.signerCertificateSha256) {
            throw 'The Desktop deployment changed while its E2E tests executed.'
          }
          "posttest_deployment_tree_sha256=$independentDigest" |
            Add-Content -Encoding utf8 'ci-evidence/desktop/build-identity.txt'

      - name: Package the exact Desktop deployment subject
        id: package-desktop
        shell: pwsh
        run: |
          $output = 'TransportERP.Desktop/bin/Release/net10.0-windows'
          $package = 'ci-evidence/desktop/TransportERP.Desktop-candidate.zip'
          if (-not (Test-Path $output)) { throw 'Desktop deployment output is missing.' }
          if (Test-Path $package) { Remove-Item -LiteralPath $package -Force }
          Compress-Archive -Path (Join-Path $output '*') -DestinationPath $package -CompressionLevel Optimal
          if (-not (Test-Path $package)) { throw 'Desktop deployment package was not produced.' }
          $digest = (Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant()
          if ($digest -notmatch '^[0-9a-f]{64}$') { throw 'Desktop deployment digest is invalid.' }
          "deployment_bundle_sha256=$digest" | Add-Content -Encoding utf8 'ci-evidence/desktop/build-identity.txt'

          $runtimeIdentity = Get-Content -Raw 'ci-evidence/desktop/runtime-build-identity-posttest.json' |
            ConvertFrom-Json
          $extracted = Join-Path $env:RUNNER_TEMP 'transporterp-desktop-candidate-extracted'
          if (Test-Path $extracted) { throw 'Desktop package verification directory already exists.' }
          Expand-Archive -LiteralPath $package -DestinationPath $extracted
          $packagedTreeDigest = (python eng/ci/verify_desktop_build_identity.py `
            --root $extracted `
            --identity 'ci-evidence/desktop/runtime-build-identity-posttest.json').Trim()
          if ($LASTEXITCODE -ne 0 -or $packagedTreeDigest -ne $runtimeIdentity.artifactSha256) {
            throw 'The Desktop deployment package content does not match the tested tree.'
          }
          "packaged_deployment_tree_sha256=$packagedTreeDigest" |
            Add-Content -Encoding utf8 'ci-evidence/desktop/build-identity.txt'
          $predicate = [ordered]@{
            schemaVersion = 1
            sourceSha = '${{ github.event.pull_request.head.sha || github.sha }}'
            treeSha = ((& git rev-parse 'HEAD^{tree}').Trim())
            platform = 'desktop-windows'
            artifactSha256 = $runtimeIdentity.artifactSha256
            deploymentBundleSha256 = $digest
            signerCertificateSha256 = $runtimeIdentity.signerCertificateSha256
          }
          $predicate | ConvertTo-Json -Compress |
            Set-Content -Encoding utf8 'ci-evidence/desktop/build-identity-predicate.json'

      - name: Attest exact Desktop deployment provenance
        id: attest-desktop
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ci-evidence/desktop/TransportERP.Desktop-candidate.zip
          predicate-type: https://github.com/shfeekalbhure/TransportERP/attestations/build-identity/v1
          predicate-path: ci-evidence/desktop/build-identity-predicate.json

      - name: Persist Desktop attestation evidence
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          PREDICATE_TYPE: https://github.com/shfeekalbhure/TransportERP/attestations/build-identity/v1
        run: |
          $bundle = '${{ steps.attest-desktop.outputs.bundle-path }}'
          if ([string]::IsNullOrWhiteSpace($bundle) -or -not (Test-Path $bundle)) {
            throw 'Desktop provenance attestation bundle is missing.'
          }
          Copy-Item -LiteralPath $bundle -Destination 'ci-evidence/desktop/provenance-attestation.json'
          gh attestation verify 'ci-evidence/desktop/TransportERP.Desktop-candidate.zip' `
            --bundle $bundle `
            --repo $env:GITHUB_REPOSITORY `
            --predicate-type $env:PREDICATE_TYPE `
            --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/ci.yml" `
            --source-digest $env:EXPECTED_SHA `
            --source-ref $env:GITHUB_REF `
            --format json `
            | Set-Content -Encoding utf8 'ci-evidence/desktop/provenance-verification.json'
          if ($LASTEXITCODE -ne 0) { throw 'Desktop provenance verification failed.' }
          @'
          import json, pathlib, sys
          expected_sha, predicate_type, predicate_path, verification_path = sys.argv[1:]
          expected = json.loads(pathlib.Path(predicate_path).read_text(encoding="utf-8-sig"))
          results = json.loads(pathlib.Path(verification_path).read_text(encoding="utf-8-sig"))
          matches = [entry for entry in results
                     if entry.get("verificationResult", {}).get("statement", {}).get("predicateType") == predicate_type
                     and entry.get("verificationResult", {}).get("statement", {}).get("predicate") == expected]
          if len(matches) != 1 or expected.get("sourceSha") != expected_sha:
              raise SystemExit("Verified Desktop attestation is not bound to the exact candidate predicate.")
          '@ | python - $env:EXPECTED_SHA $env:PREDICATE_TYPE `
            'ci-evidence/desktop/build-identity-predicate.json' `
            'ci-evidence/desktop/provenance-verification.json'
          if ($LASTEXITCODE -ne 0) { throw 'Desktop predicate verification failed.' }
          'attestation_verification=PASS' |
            Set-Content -Encoding utf8 'ci-evidence/desktop/provenance-verification.txt'
          @(
            'attestation_provider=github-oidc-sigstore'
            'attestation_id=${{ steps.attest-desktop.outputs.attestation-id }}'
            'attestation_url=${{ steps.attest-desktop.outputs.attestation-url }}'
          ) | Set-Content -Encoding utf8 'ci-evidence/desktop/provenance-attestation.txt'

      - name: Stop Desktop E2E PostgreSQL
        if: ${{ always() }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:DESKTOP_E2E_POSTGRES_BIN -and $env:DESKTOP_E2E_POSTGRES_DATA) {
            $pgCtl = Join-Path $env:DESKTOP_E2E_POSTGRES_BIN 'pg_ctl.exe'
            if (Test-Path $pgCtl) {
              & $pgCtl -D $env:DESKTOP_E2E_POSTGRES_DATA status *> $null
              if ($LASTEXITCODE -eq 0) {
                & $pgCtl -D $env:DESKTOP_E2E_POSTGRES_DATA stop --mode=fast
                if ($LASTEXITCODE -ne 0) { throw 'Desktop E2E PostgreSQL shutdown failed.' }
              }
            }
          }
          if ($env:DESKTOP_E2E_POSTGRES_LOG -and (Test-Path $env:DESKTOP_E2E_POSTGRES_LOG)) {
            New-Item -ItemType Directory -Force -Path 'ci-evidence/desktop' | Out-Null
            Copy-Item $env:DESKTOP_E2E_POSTGRES_LOG 'ci-evidence/desktop/postgresql.log'
          }

      - name: Write exact-head evidence manifest
        if: ${{ always() }}
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          New-Item -ItemType Directory -Force -Path 'ci-evidence/desktop' | Out-Null
          $actual = (& git rev-parse HEAD 2>$null)
          if ($LASTEXITCODE -ne 0) { $actual = 'unavailable' } else { $actual = $actual.Trim() }
          $tree = (& git rev-parse 'HEAD^{tree}' 2>$null)
          if ($LASTEXITCODE -ne 0) { $tree = 'unavailable' } else { $tree = $tree.Trim() }
          @(
            "workflow=$env:GITHUB_WORKFLOW"
            'job=desktop-contract'
            "event=$env:GITHUB_EVENT_NAME"
            "run_id=$env:GITHUB_RUN_ID"
            "run_attempt=$env:GITHUB_RUN_ATTEMPT"
            "job_status=$env:JOB_STATUS"
            "ref=$env:GITHUB_REF"
            "expected_sha=$env:EXPECTED_SHA"
            "actual_sha=$actual"
            "tree_sha=$tree"
          ) | Set-Content -Encoding utf8 'ci-evidence/desktop/exact-head-manifest.txt'
          if ($actual -ne $env:EXPECTED_SHA) { throw 'Desktop evidence manifest does not match the expected exact head.' }

      - name: Upload Desktop CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-desktop-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ci-evidence/desktop/exact-head-manifest.txt
            ci-evidence/desktop/build-identity.txt
            ci-evidence/desktop/runtime-build-identity.json
            ci-evidence/desktop/runtime-build-identity-final.json
            ci-evidence/desktop/runtime-build-identity-posttest.json
            ci-evidence/desktop/build-identity-predicate.json
            ci-evidence/desktop/TransportERP.Desktop-candidate.zip
            ci-evidence/desktop/provenance-attestation.json
            ci-evidence/desktop/provenance-attestation.txt
            ci-evidence/desktop/provenance-verification.txt
            ci-evidence/desktop/provenance-verification.json
            ci-evidence/desktop/postgresql-identity.txt
            ci-evidence/desktop/postgresql.log
            ci-evidence/desktop/desktop-release-e2e-checkpoints.txt
            TransportERP.Desktop.E2ETests/TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 30

  offline-client-core:
    name: Required CI / Encrypted offline client core
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          echo "actual=$actual"
          echo "expected=$expected"
          test "$actual" = "$expected" || { echo 'Offline client job is not running on the exact PR head.'; exit 1; }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore encrypted offline client tests
        run: dotnet restore TransportERP.Offline.Tests/TransportERP.Offline.Tests.csproj

      - name: Build encrypted offline client core
        run: dotnet build TransportERP.Offline.Tests/TransportERP.Offline.Tests.csproj --configuration Release --no-restore -p:TransportERPImplementationSha="$EXPECTED_SHA"

      - name: Run encrypted offline client tests
        run: dotnet test TransportERP.Offline.Tests/TransportERP.Offline.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=ci-offline-client-tests.trx" -p:TransportERPImplementationSha="$EXPECTED_SHA"

      - name: Verify encrypted Offline tests executed with no skips
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path("TransportERP.Offline.Tests/TestResults").rglob("ci-offline-client-tests.trx"))
          if len(reports) != 1:
              raise SystemExit(f"Expected exactly one Offline TRX report, found {len(reports)}.")
          counters = ET.parse(reports[0]).getroot().find(".//{*}Counters")
          if counters is None:
              raise SystemExit("Offline TRX report has no counters.")
          total = int(counters.attrib.get("total", "0"))
          passed = int(counters.attrib.get("passed", "0"))
          failed = int(counters.attrib.get("failed", "0"))
          not_executed = int(counters.attrib.get("notExecuted", "0"))
          if total < 1 or passed != total or failed != 0 or not_executed != 0:
              raise SystemExit(
                  "Offline suite did not execute fail-closed: "
                  f"total={total}, passed={passed}, failed={failed}, notExecuted={not_executed}."
              )
          print(f"Offline suite executed: total={total}, passed={passed}, skipped={not_executed}")
          PY

      - name: Write exact-head evidence manifest
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p ci-evidence/offline-client
          actual=$(git rev-parse HEAD 2>/dev/null || echo unavailable)
          tree=$(git rev-parse HEAD^{tree} 2>/dev/null || echo unavailable)
          {
            echo "workflow=$GITHUB_WORKFLOW"
            echo "job=offline-client-core"
            echo "event=$GITHUB_EVENT_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "job_status=$JOB_STATUS"
            echo "ref=$GITHUB_REF"
            echo "expected_sha=$EXPECTED_SHA"
            echo "actual_sha=$actual"
            echo "tree_sha=$tree"
          } > ci-evidence/offline-client/exact-head-manifest.txt
          test "$actual" = "$EXPECTED_SHA"

      - name: Upload offline client CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-offline-client-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ci-evidence/offline-client/exact-head-manifest.txt
            TransportERP.Offline.Tests/TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 30

  mobile-contract:
    name: Required CI / Android Driver executable + mobile contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "actual=$actual"
          echo "expected=$expected"
          test "$actual" = "$expected" || { echo 'Mobile job is not running on the exact PR head.'; exit 1; }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android --skip-sign-check

      - name: Restore Mobile projects
        shell: bash
        run: |
          dotnet restore TransportERP.Mobile.Admin/TransportERP.Mobile.Admin.csproj
          dotnet restore TransportERP.Mobile.Customer/TransportERP.Mobile.Customer.csproj
          dotnet restore TransportERP.Mobile.Driver/TransportERP.Mobile.Driver.csproj

      - name: Build Mobile projects and Android Driver APK
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SHA"
          dotnet build TransportERP.Mobile.Admin/TransportERP.Mobile.Admin.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:SourceRevisionId="$EXPECTED_SHA" -p:TransportERPImplementationSha="$EXPECTED_SHA"
          dotnet build TransportERP.Mobile.Customer/TransportERP.Mobile.Customer.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:SourceRevisionId="$EXPECTED_SHA" -p:TransportERPImplementationSha="$EXPECTED_SHA"
          dotnet build TransportERP.Mobile.Driver/TransportERP.Mobile.Driver.csproj --configuration Release --no-restore -f net10.0-android -p:AndroidPackageFormats=apk -p:ContinuousIntegrationBuild=true -p:SourceRevisionId="$EXPECTED_SHA" -p:TransportERPImplementationSha="$EXPECTED_SHA" -p:TransportERPClientPublicOrigin=https://10.0.2.2:8443/
          release_apk=$(find TransportERP.Mobile.Driver/bin/Release/net10.0-android -type f -name '*-Signed.apk' -print -quit)
          if [ -z "$release_apk" ]; then
            echo 'Signed Android Driver APK artifact was not produced.'
            exit 1
          fi
          mkdir -p ci-evidence/mobile
          cp -- "$release_apk" ci-evidence/mobile/TransportERP.Mobile.Driver.Release.apk
          release_apk=ci-evidence/mobile/TransportERP.Mobile.Driver.Release.apk
          apkanalyzer=$(command -v apkanalyzer 2>/dev/null || true)
          if [ -z "$apkanalyzer" ]; then
            apkanalyzer=$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer \
              -print -quit 2>/dev/null || true)
          fi
          if [ -z "$apkanalyzer" ] || [ ! -x "$apkanalyzer" ]; then
            echo 'Android apkanalyzer executable was not found.'
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print \
            2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            echo 'Android apksigner executable was not found.'
            exit 1
          fi
          apksigner_cli_version=$("$apksigner" version 2>/dev/null || true)
          apksigner_build_tools_version=$(basename "$(dirname "$apksigner")")
          if [[ ! "$apksigner_cli_version" =~ ^[0-9]+([.][0-9]+){1,3}([-+][A-Za-z0-9.]+)?$ ]]; then
            apksigner_cli_version=unavailable
          fi
          if [[ ! "$apksigner_build_tools_version" =~ ^[0-9]+([.][0-9]+){1,3}([-+][A-Za-z0-9.]+)?$ ]]; then
            apksigner_build_tools_version=unavailable
          fi
          echo "Android apksigner cli_version=$apksigner_cli_version build_tools_version=$apksigner_build_tools_version"
          signer_stdout="$RUNNER_TEMP/mobile-release-apksigner.stdout"
          signer_stderr="$RUNNER_TEMP/mobile-release-apksigner.stderr"
          if ! "$apksigner" verify --print-certs "$release_apk" \
              > "$signer_stdout" 2> "$signer_stderr"; then
            echo 'Android Release APK signature verification failed.'
            exit 1
          fi
          if ! signer_sha256=$(python3 - "$signer_stdout" "$signer_stderr" <<'PY'
          import pathlib, re, sys

          prefixes = (
              re.compile(r"^Signer #[1-9][0-9]* certificate SHA-256 digest:"),
              re.compile(
                  r"^V[1-9][0-9]*(?:\.[0-9]+)? Signer:[ \t]*"
                  r"certificate SHA-256 digest:"),
          )
          fields = (
              re.compile(
                  r"^Signer #[1-9][0-9]* certificate SHA-256 digest:[ \t]*"
                  r"([0-9A-Fa-f]{64})[ \t]*$"),
              re.compile(
                  r"^V[1-9][0-9]*(?:\.[0-9]+)? Signer:[ \t]*"
                  r"certificate SHA-256 digest:[ \t]*"
                  r"([0-9A-Fa-f]{64})[ \t]*$"),
          )
          matches = []
          for name in sys.argv[1:]:
              path = pathlib.Path(name)
              raw = path.read_bytes()
              lines = raw.decode("utf-8", errors="strict").splitlines()
              for line_number, line in enumerate(lines, 1):
                  match = next(
                      (candidate for field in fields
                       if (candidate := field.fullmatch(line)) is not None),
                      None)
                  if match is not None:
                      matches.append(match.group(1).lower())
                      continue
                  if any(prefix.match(line) for prefix in prefixes):
                      raise SystemExit(
                          f"Recognized signer SHA-256 field is malformed in "
                          f"{path.name}:{line_number}.")
                  if "certificate sha-256 digest:" in line.casefold():
                      raise SystemExit(
                          f"Unrecognized signer SHA-256 field in "
                          f"{path.name}:{line_number}.")
          unique_matches = set(matches)
          if not matches or len(unique_matches) != 1:
              raise SystemExit(
                  "Expected at least one recognized signer SHA-256 field and "
                  "exactly one distinct signer identity across apksigner "
                  f"stdout/stderr; found {len(matches)} fields and "
                  f"{len(unique_matches)} distinct identities.")
          print(next(iter(unique_matches)), end="")
          PY
          ); then
            echo 'Android Release APK signer digest extraction failed closed.'
            exit 1
          fi
          if [[ ! "$signer_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Android Release APK signer digest is not canonical SHA-256.'
            exit 1
          fi
          if ! "$apkanalyzer" manifest print "$release_apk" > ci-evidence/mobile/release-manifest.xml; then
            echo 'Android Release APK manifest inspection failed.'
            exit 1
          fi
          if grep -Fq 'com.transporterp.mobile.driver.DriverDeviceTestActivity' ci-evidence/mobile/release-manifest.xml; then
            echo 'The test-only Android activity leaked into the Release APK.'
            exit 1
          fi
          {
            echo 'schema_version=1'
            echo "source_sha=$actual"
            echo "tree_sha=$(git rev-parse 'HEAD^{tree}')"
            echo "apk_path=$release_apk"
            echo "apk_sha256=$(sha256sum "$release_apk" | awk '{print $1}')"
            echo "signer_certificate_sha256=$signer_sha256"
          } > ci-evidence/mobile/build-identity.txt

          python3 - "$actual" "$(git rev-parse 'HEAD^{tree}')" "$release_apk" "$signer_sha256" <<'PY'
          import hashlib, json, pathlib, sys
          source_sha, tree_sha, artifact_path, signer_sha = sys.argv[1:]
          artifact = pathlib.Path(artifact_path)
          predicate = {
              "schemaVersion": 1,
              "sourceSha": source_sha,
              "treeSha": tree_sha,
              "platform": "android",
              "artifactSha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
              "signerCertificateSha256": signer_sha,
          }
          pathlib.Path("ci-evidence/mobile/build-identity-predicate.json").write_text(
              json.dumps(predicate, sort_keys=True, separators=(",", ":")), encoding="utf-8")
          PY

      - name: Verify Mobile governed implementation identity
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $applicationAssembly = 'TransportERP.Application/bin/Release/net10.0/TransportERP.Application.dll'
          if (-not (Test-Path $applicationAssembly)) { throw 'Governed Mobile application assembly was not produced.' }
          $governedAssembly = [System.Reflection.Assembly]::LoadFrom((Resolve-Path $applicationAssembly).Path)
          $implementationSha = $governedAssembly.GetCustomAttributes([System.Reflection.AssemblyMetadataAttribute], $false) |
            Where-Object Key -eq 'TransportERPImplementationSha' |
            Select-Object -ExpandProperty Value -First 1
          if ($implementationSha -ne $env:EXPECTED_SHA) {
            throw 'Mobile governed implementation metadata is unbound or does not match the candidate source SHA.'
          }
          Add-Content -Encoding utf8 'ci-evidence/mobile/build-identity.txt' "implementation_sha=$implementationSha"
          Add-Content -Encoding utf8 'ci-evidence/mobile/build-identity.txt' "application_assembly_sha256=$((Get-FileHash -Algorithm SHA256 $applicationAssembly).Hash.ToLowerInvariant())"

      - name: Upload the exact Android Release runtime candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ci-evidence/mobile/TransportERP.Mobile.Driver.Release.apk
            ci-evidence/mobile/build-identity.txt
            ci-evidence/mobile/build-identity-predicate.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest exact Android Release APK provenance
        id: attest-mobile
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ci-evidence/mobile/TransportERP.Mobile.Driver.Release.apk
          predicate-type: https://github.com/shfeekalbhure/TransportERP/attestations/build-identity/v1
          predicate-path: ci-evidence/mobile/build-identity-predicate.json

      - name: Persist Android Release attestation evidence
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          PREDICATE_TYPE: https://github.com/shfeekalbhure/TransportERP/attestations/build-identity/v1
        run: |
          set -euo pipefail
          bundle='${{ steps.attest-mobile.outputs.bundle-path }}'
          test -n "$bundle" && test -f "$bundle"
          cp -- "$bundle" ci-evidence/mobile/provenance-attestation.json
          gh attestation verify ci-evidence/mobile/TransportERP.Mobile.Driver.Release.apk \
            --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type "$PREDICATE_TYPE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-digest "$EXPECTED_SHA" \
            --source-ref "$GITHUB_REF" \
            --format json \
            > ci-evidence/mobile/provenance-verification.json
          python3 - "$EXPECTED_SHA" "$PREDICATE_TYPE" \
            ci-evidence/mobile/build-identity-predicate.json \
            ci-evidence/mobile/provenance-verification.json <<'PY'
          import json, pathlib, sys
          expected_sha, predicate_type, predicate_path, verification_path = sys.argv[1:]
          expected = json.loads(pathlib.Path(predicate_path).read_text(encoding="utf-8"))
          results = json.loads(pathlib.Path(verification_path).read_text(encoding="utf-8"))
          matches = [entry for entry in results
                     if entry.get("verificationResult", {}).get("statement", {}).get("predicateType") == predicate_type
                     and entry.get("verificationResult", {}).get("statement", {}).get("predicate") == expected]
          if len(matches) != 1 or expected.get("sourceSha") != expected_sha:
              raise SystemExit("Verified Android Release attestation is not bound to the exact candidate predicate.")
          PY
          echo 'attestation_verification=PASS' > ci-evidence/mobile/provenance-verification.txt
          {
            echo 'attestation_provider=github-oidc-sigstore'
            echo 'attestation_id=${{ steps.attest-mobile.outputs.attestation-id }}'
            echo 'attestation_url=${{ steps.attest-mobile.outputs.attestation-url }}'
          } > ci-evidence/mobile/provenance-attestation.txt

      - name: Write exact-head evidence manifest
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p ci-evidence/mobile
          actual=$(git rev-parse HEAD 2>/dev/null || echo unavailable)
          tree=$(git rev-parse HEAD^{tree} 2>/dev/null || echo unavailable)
          {
            echo "workflow=$GITHUB_WORKFLOW"
            echo "job=mobile-contract"
            echo "event=$GITHUB_EVENT_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "job_status=$JOB_STATUS"
            echo "ref=$GITHUB_REF"
            echo "expected_sha=$EXPECTED_SHA"
            echo "actual_sha=$actual"
            echo "tree_sha=$tree"
          } > ci-evidence/mobile/exact-head-manifest.txt
          test "$actual" = "$EXPECTED_SHA"

      - name: Upload Mobile CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-mobile-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ci-evidence/mobile/exact-head-manifest.txt
            ci-evidence/mobile/build-identity.txt
            ci-evidence/mobile/build-identity-predicate.json
            ci-evidence/mobile/release-manifest.xml
            ci-evidence/mobile/TransportERP.Mobile.Driver.Release.apk
            ci-evidence/mobile/provenance-attestation.json
            ci-evidence/mobile/provenance-attestation.txt
            ci-evidence/mobile/provenance-verification.txt
            ci-evidence/mobile/provenance-verification.json
            TransportERP.Mobile.Driver/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: warn
          retention-days: 30

  android-device-runtime:
    name: Required CI / Android native security runtime
    needs: mobile-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: transporter_android_ci
          POSTGRES_PASSWORD: android-ci-database-password
          POSTGRES_DB: transporter_android_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transporter_android_ci -d transporter_android_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Job-level env is evaluated before the runner context exists. Use an explicit ephemeral
      # path on the isolated hosted runner so workflow validation remains fail-closed.
      ANDROID_AVD_HOME: /tmp/transporterp-android-avd
      ANDROID_TEST_PACKAGE: com.transporterp.mobile.driver
      ANDROID_TEST_COMPONENT: com.transporterp.mobile.driver/com.transporterp.mobile.driver.DriverDeviceTestActivity
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "actual=$actual"
          echo "expected=$expected"
          test "$actual" = "$expected" || { echo 'Android runtime job is not running on the exact PR head.'; exit 1; }

      - name: Download the exact Android Release runtime candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-input/android-release

      - name: Verify downloaded Android Release candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          release_apk=ci-input/android-release/TransportERP.Mobile.Driver.Release.apk
          identity=ci-input/android-release/build-identity.txt
          predicate=ci-input/android-release/build-identity-predicate.json
          test -f "$release_apk" && test -f "$identity" && test -f "$predicate"
          grep -Fx "source_sha=$EXPECTED_SHA" "$identity"
          expected_apk_sha=$(sed -n 's/^apk_sha256=//p' "$identity")
          test "$(printf '%s' "$expected_apk_sha" | wc -l)" -eq 0
          [[ "$expected_apk_sha" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$release_apk" | awk '{print $1}')" = "$expected_apk_sha"
          python3 - "$EXPECTED_SHA" "$release_apk" "$predicate" <<'PY'
          import hashlib, json, pathlib, sys
          expected_sha, apk_path, predicate_path = sys.argv[1:]
          apk = pathlib.Path(apk_path)
          predicate = json.loads(pathlib.Path(predicate_path).read_text(encoding="utf-8"))
          if predicate.get("sourceSha") != expected_sha:
              raise SystemExit("Android Release predicate source SHA mismatch.")
          if predicate.get("artifactSha256") != hashlib.sha256(apk.read_bytes()).hexdigest():
              raise SystemExit("Android Release predicate artifact digest mismatch.")
          PY
          mkdir -p ci-evidence/android-runtime
          cp -- "$release_apk" ci-evidence/android-runtime/TransportERP.Mobile.Driver.Release.apk
          cp -- "$identity" ci-evidence/android-runtime/release-build-identity.txt
          cp -- "$predicate" ci-evidence/android-runtime/release-build-identity-predicate.json
          printf '%s' "$release_apk" > "$RUNNER_TEMP/android-release-apk.txt"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI and pinned Android emulator image
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0 postgresql-client openssl
          dotnet workload install maui-android --skip-sign-check
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          test -x "$sdkmanager"
          test -x "$avdmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$sdkmanager" \
            'platform-tools' \
            'emulator' \
            'system-images;android-35;google_apis;x86_64'
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$avdmanager" create avd \
            --force \
            --name transporterptest \
            --package 'system-images;android-35;google_apis;x86_64'

      - name: Create pinned ephemeral Android E2E TLS identity
        shell: bash
        run: |
          set -euo pipefail
          tls_dir="$RUNNER_TEMP/android-e2e-tls"
          mkdir -p "$tls_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=10.0.2.2' \
            -addext 'subjectAltName=IP:10.0.2.2,DNS:localhost,IP:127.0.0.1' \
            -keyout "$tls_dir/server.key" \
            -out "$tls_dir/server.crt" >/dev/null 2>&1
          openssl pkcs12 -export \
            -inkey "$tls_dir/server.key" \
            -in "$tls_dir/server.crt" \
            -out "$tls_dir/server.pfx" \
            -passout pass:android-ci-tls-password
          openssl x509 -in "$tls_dir/server.crt" -outform der \
            | sha256sum | awk '{print $1}' > "$tls_dir/server-cert-sha256.txt"
          test "$(wc -c < "$tls_dir/server-cert-sha256.txt")" -eq 65

      - name: Build compile-gated Android device-test APK
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SHA"
          certificate_sha=$(cat "$RUNNER_TEMP/android-e2e-tls/server-cert-sha256.txt")
          dotnet restore TransportERP.Mobile.Driver/TransportERP.Mobile.Driver.csproj
          dotnet build TransportERP.Mobile.Driver/TransportERP.Mobile.Driver.csproj \
            --configuration Debug \
            --no-restore \
            -f net10.0-android \
            -p:TransportERPDeviceTests=true \
            -p:AndroidPackageFormats=apk \
            -p:EmbedAssembliesIntoApk=true \
            -p:ContinuousIntegrationBuild=true \
            -p:SourceRevisionId="$EXPECTED_SHA" \
            -p:TransportERPImplementationSha="$EXPECTED_SHA" \
            -p:TransportERPClientPublicOrigin=https://10.0.2.2:8443/ \
            -p:TransportERPDeviceTestServerCertificateSha256="$certificate_sha"
          test_apk=$(find TransportERP.Mobile.Driver/bin/Debug/net10.0-android -type f -name '*-Signed.apk' -print -quit)
          if [ -z "$test_apk" ]; then
            echo 'Signed Android device-test APK artifact was not produced.'
            exit 1
          fi
          test -n "$test_apk"
          mkdir -p ci-evidence/android-runtime
          cp -- "$test_apk" ci-evidence/android-runtime/TransportERP.Mobile.Driver.DeviceTests.apk
          test_apk=ci-evidence/android-runtime/TransportERP.Mobile.Driver.DeviceTests.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print \
            2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            echo 'Android apksigner executable was not found for the device-test APK.'
            exit 1
          fi
          apksigner_cli_version=$("$apksigner" version 2>/dev/null || true)
          apksigner_build_tools_version=$(basename "$(dirname "$apksigner")")
          if [[ ! "$apksigner_cli_version" =~ ^[0-9]+([.][0-9]+){1,3}([-+][A-Za-z0-9.]+)?$ ]]; then
            apksigner_cli_version=unavailable
          fi
          if [[ ! "$apksigner_build_tools_version" =~ ^[0-9]+([.][0-9]+){1,3}([-+][A-Za-z0-9.]+)?$ ]]; then
            apksigner_build_tools_version=unavailable
          fi
          echo "Android apksigner cli_version=$apksigner_cli_version build_tools_version=$apksigner_build_tools_version"
          signer_stdout="$RUNNER_TEMP/android-device-test-apksigner.stdout"
          signer_stderr="$RUNNER_TEMP/android-device-test-apksigner.stderr"
          if ! "$apksigner" verify --print-certs "$test_apk" \
              > "$signer_stdout" 2> "$signer_stderr"; then
            echo 'Android device-test APK signature verification failed.'
            exit 1
          fi
          if ! signer_sha256=$(python3 - "$signer_stdout" "$signer_stderr" <<'PY'
          import pathlib, re, sys

          prefixes = (
              re.compile(r"^Signer #[1-9][0-9]* certificate SHA-256 digest:"),
              re.compile(
                  r"^V[1-9][0-9]*(?:\.[0-9]+)? Signer:[ \t]*"
                  r"certificate SHA-256 digest:"),
          )
          fields = (
              re.compile(
                  r"^Signer #[1-9][0-9]* certificate SHA-256 digest:[ \t]*"
                  r"([0-9A-Fa-f]{64})[ \t]*$"),
              re.compile(
                  r"^V[1-9][0-9]*(?:\.[0-9]+)? Signer:[ \t]*"
                  r"certificate SHA-256 digest:[ \t]*"
                  r"([0-9A-Fa-f]{64})[ \t]*$"),
          )
          matches = []
          for name in sys.argv[1:]:
              path = pathlib.Path(name)
              raw = path.read_bytes()
              lines = raw.decode("utf-8", errors="strict").splitlines()
              for line_number, line in enumerate(lines, 1):
                  match = next(
                      (candidate for field in fields
                       if (candidate := field.fullmatch(line)) is not None),
                      None)
                  if match is not None:
                      matches.append(match.group(1).lower())
                      continue
                  if any(prefix.match(line) for prefix in prefixes):
                      raise SystemExit(
                          f"Recognized signer SHA-256 field is malformed in "
                          f"{path.name}:{line_number}.")
                  if "certificate sha-256 digest:" in line.casefold():
                      raise SystemExit(
                          f"Unrecognized signer SHA-256 field in "
                          f"{path.name}:{line_number}.")
          unique_matches = set(matches)
          if not matches or len(unique_matches) != 1:
              raise SystemExit(
                  "Expected at least one recognized signer SHA-256 field and "
                  "exactly one distinct signer identity across apksigner "
                  f"stdout/stderr; found {len(matches)} fields and "
                  f"{len(unique_matches)} distinct identities.")
          print(next(iter(unique_matches)), end="")
          PY
          ); then
            echo 'Android device-test APK signer digest extraction failed closed.'
            exit 1
          fi
          if [[ ! "$signer_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Android device-test APK signer digest is not canonical SHA-256.'
            exit 1
          fi
          echo "$test_apk" > "$RUNNER_TEMP/android-device-test-apk.txt"
          printf '%s' "$signer_sha256" > "$RUNNER_TEMP/android-device-test-signer-sha256.txt"
          {
            echo 'schema_version=1'
            echo "source_sha=$actual"
            echo "tree_sha=$(git rev-parse 'HEAD^{tree}')"
            echo "test_apk_sha256=$(sha256sum "$test_apk" | awk '{print $1}')"
            echo "signer_certificate_sha256=$signer_sha256"
          } > ci-evidence/android-runtime/device-test-build-identity.txt

          python3 - "$actual" "$(git rev-parse 'HEAD^{tree}')" "$test_apk" "$signer_sha256" <<'PY'
          import hashlib, json, pathlib, sys
          source_sha, tree_sha, artifact_path, signer_sha = sys.argv[1:]
          artifact = pathlib.Path(artifact_path)
          predicate = {
              "schemaVersion": 1,
              "sourceSha": source_sha,
              "treeSha": tree_sha,
              "platform": "android",
              "artifactSha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
              "signerCertificateSha256": signer_sha,
          }
          pathlib.Path("ci-evidence/android-runtime/build-identity-predicate.json").write_text(
              json.dumps(predicate, sort_keys=True, separators=(",", ":")), encoding="utf-8")
          PY

      - name: Verify Android device-test governed implementation identity
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $applicationAssembly = 'TransportERP.Application/bin/Debug/net10.0/TransportERP.Application.dll'
          if (-not (Test-Path $applicationAssembly)) { throw 'Governed Android test application assembly was not produced.' }
          $governedAssembly = [System.Reflection.Assembly]::LoadFrom((Resolve-Path $applicationAssembly).Path)
          $implementationSha = $governedAssembly.GetCustomAttributes([System.Reflection.AssemblyMetadataAttribute], $false) |
            Where-Object Key -eq 'TransportERPImplementationSha' |
            Select-Object -ExpandProperty Value -First 1
          if ($implementationSha -ne $env:EXPECTED_SHA) {
            throw 'Android test implementation metadata is unbound or does not match the candidate source SHA.'
          }
          $identity = 'ci-evidence/android-runtime/device-test-build-identity.txt'
          Add-Content -Encoding utf8 $identity "implementation_sha=$implementationSha"
          Add-Content -Encoding utf8 $identity "application_assembly_sha256=$((Get-FileHash -Algorithm SHA256 $applicationAssembly).Hash.ToLowerInvariant())"

      - name: Bootstrap PostgreSQL and provision the Android registered device
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PGPASSWORD: android-ci-database-password
        run: |
          set -euo pipefail
          connection='Host=127.0.0.1;Port=5432;Database=transporter_android_ci;Username=transporter_android_ci;Password=android-ci-database-password;Include Error Detail=false'
          tls_dir="$RUNNER_TEMP/android-e2e-tls"
          admin_password=$(openssl rand -hex 24)
          device_credential=$(openssl rand -base64 32)
          release_device_credential=$(openssl rand -base64 32)
          echo "::add-mask::$admin_password"
          echo "::add-mask::$device_credential"
          echo "::add-mask::$release_device_credential"
          export ANDROID_E2E_ADMIN_PASSWORD="$admin_password"
          export ANDROID_E2E_DEVICE_CREDENTIAL="$device_credential"
          export ANDROID_E2E_RELEASE_DEVICE_CREDENTIAL="$release_device_credential"
          api_content_root="$PWD/TransportERP.Api/bin/Release/net10.0"
          common_environment=(
            "TRANSPORTERP_CONNECTION_STRING=$connection"
            "ASPNETCORE_CONTENTROOT=$api_content_root"
            'Auth__Mode=LocalSessions'
            'Auth__Issuer=transporter-android-ci'
            'Auth__Audience=transporter-android-ci'
            'Auth__SigningKeyId=android-ci-current'
            'Auth__SigningKey=android-ci-signing-key-at-least-thirty-two-characters'
            'AllowedHosts=localhost;127.0.0.1;10.0.2.2'
            'Sync__Proof__PublicOrigin=https://10.0.2.2:8443'
            'ASPNETCORE_ENVIRONMENT=Development'
            'ASPNETCORE_URLS=https://0.0.0.0:8443'
            "ASPNETCORE_Kestrel__Certificates__Default__Path=$tls_dir/server.pfx"
            'ASPNETCORE_Kestrel__Certificates__Default__Password=android-ci-tls-password'
          )

          dotnet build TransportERP.Api/TransportERP.Api.csproj \
            --configuration Release \
            -p:ContinuousIntegrationBuild=true \
            -p:SourceRevisionId="$EXPECTED_SHA" \
            -p:TransportERPImplementationSha="$EXPECTED_SHA"
          test -f "$api_content_root/appsettings.json"

          export TRANSPORTERP_BOOTSTRAP_ADMIN_PASSWORD="$admin_password"
          env "${common_environment[@]}" \
            'BootstrapAdmin__CurrencyCode=YER' \
            'BootstrapAdmin__CurrencyNameAr=Android CI Currency' \
            'BootstrapAdmin__CurrencyMinorUnit=2' \
