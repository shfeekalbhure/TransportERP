name: MISSION-03 DBP-002 Materialize Migration 11

on:
  push:
    branches:
      - codex/mission-03-execution-20260828

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Materialize exact successful generator artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if find TransportERP.Infrastructure/Persistence/Migrations -maxdepth 1 -name '*_GreenfieldTenantMembershipIsolation.cs' | grep -q .; then
            echo 'Migration 11 already materialized; no action required.'
            exit 0
          fi

          artifact_id=9704034855
          expected_zip_sha256=4c29bbf3824bcbdd660fdfde044e07765bdc3bc5042ac7155f308c0ef3470044
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/dbp002-migration11.zip
          echo "${expected_zip_sha256}  /tmp/dbp002-migration11.zip" | sha256sum --check --strict

          rm -rf /tmp/dbp002-generated
          mkdir -p /tmp/dbp002-generated
          unzip -q /tmp/dbp002-migration11.zip -d /tmp/dbp002-generated

          test "$(sha256sum /tmp/dbp002-generated/20260828224241_GreenfieldTenantMembershipIsolation.cs | cut -d' ' -f1)" = "a7a02c3d6f27a00d075b29ba415e876049cf1ef95d4c63672b99d88d27ad8e38"
          test "$(sha256sum /tmp/dbp002-generated/20260828224241_GreenfieldTenantMembershipIsolation.Designer.cs | cut -d' ' -f1)" = "73d7eed6a5915820b45326e1239b540eb5a68d079960cbbb8aeb7267733b1b4c"
          test "$(sha256sum /tmp/dbp002-generated/TransportErpDbContextModelSnapshot.cs | cut -d' ' -f1)" = "fd7314fc074fa80474323d1745cdd7f381c8ad426d7c90330cd64e932b1ca5d4"

          cp /tmp/dbp002-generated/20260828224241_GreenfieldTenantMembershipIsolation.cs TransportERP.Infrastructure/Persistence/Migrations/
          cp /tmp/dbp002-generated/20260828224241_GreenfieldTenantMembershipIsolation.Designer.cs TransportERP.Infrastructure/Persistence/Migrations/
          cp /tmp/dbp002-generated/TransportErpDbContextModelSnapshot.cs TransportERP.Infrastructure/Persistence/Migrations/TransportErpDbContextModelSnapshot.cs

          git add TransportERP.Infrastructure/Persistence/Migrations/20260828224241_GreenfieldTenantMembershipIsolation.cs \
                  TransportERP.Infrastructure/Persistence/Migrations/20260828224241_GreenfieldTenantMembershipIsolation.Designer.cs \
                  TransportERP.Infrastructure/Persistence/Migrations/TransportErpDbContextModelSnapshot.cs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'MISSION-03 DBP-002: materialize generated Migration 11'
          git push origin "HEAD:${GITHUB_REF_NAME}"
