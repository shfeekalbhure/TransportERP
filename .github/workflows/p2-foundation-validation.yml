name: P2 foundation validation

on:
  push:
    branches:
      - integration/p2-c01-foundation-20260820
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  contracts-and-p1-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore TransportERP.Tests/TransportERP.Tests.csproj

      - name: Test P1 and recovered P2 foundation contracts
        run: dotnet test TransportERP.Tests/TransportERP.Tests.csproj --configuration Debug --no-restore

      - name: Compile Desktop recovered contract surface as library
        run: dotnet build TransportERP.Desktop/TransportERP.Desktop.csproj --configuration Debug -p:OutputType=Library
