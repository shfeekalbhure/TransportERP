name: Build validation

on:
  push:
    branches:
      - setup/initial-solution-structure
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore TransportERP.slnx
      - name: Build
        run: dotnet build TransportERP.slnx --configuration Debug --no-restore
      - name: Test request policy and CoreUI architecture enforcement
        run: dotnet test TransportERP.Tests/TransportERP.Tests.csproj --configuration Debug --no-build
