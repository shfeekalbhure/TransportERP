name: MISSION-03 DBP-002 Full Rehearsal v2

on:
  push:
    branches:
      - codex/mission-03-execution-20260828

permissions:
  contents: read

jobs:
  dbp002-rehearsal-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      BASE_SHA: 5d1352b4fb6d56261dff8b8a622bacb2786f56d9
      BASELINE_MIGRATION: 20260821191039_P2C01CWaybillVolumeContract
      CANDIDATE_MIGRATION: 20260828224241_GreenfieldTenantMembershipIsolation
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Capture immutable identity and PostgreSQL 18.6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          PGCID="$(docker ps --filter ancestor=postgres:18.6-bookworm --format '{{.ID}}' | head -n1)"
          test -n "$PGCID"
          echo "PGCID=$PGCID" >> "$GITHUB_ENV"
          printf 'HEAD=%s\nTREE=%s\nPARENT=%s\n' "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" "$(git rev-parse HEAD^)" | tee evidence/git-identity.txt
          docker exec "$PGCID" psql -U postgres -d postgres -Atc 'SHOW server_version;' | tee evidence/postgresql-version.txt
          grep -q '^18\.6' evidence/postgresql-version.txt

      - name: Prove original ten migration files unchanged and capture candidate hashes
        shell: bash
        run: |
          set -euo pipefail
          : > evidence/original-ten-preservation.txt
          while IFS= read -r p; do
            b="$(git rev-parse "${BASE_SHA}:${p}")"; h="$(git rev-parse "HEAD:${p}")"
            printf '%s|%s|%s\n' "$p" "$b" "$h" | tee -a evidence/original-ten-preservation.txt
            test "$b" = "$h"
          done < <(git ls-tree -r --name-only "$BASE_SHA" TransportERP.Infrastructure/Persistence/Migrations | grep -E '/202608(19|20|21)[0-9_].*\.cs$' | sort)
          test "$(wc -l < evidence/original-ten-preservation.txt)" -eq 19
          git diff "$BASE_SHA" -- TransportERP.Infrastructure/Persistence/Migrations/TransportErpDbContextModelSnapshot.cs > evidence/model-snapshot.diff
          test -s evidence/model-snapshot.diff
          sha256sum \
            TransportERP.Infrastructure/Persistence/Migrations/20260828224241_GreenfieldTenantMembershipIsolation.cs \
            TransportERP.Infrastructure/Persistence/Migrations/20260828224241_GreenfieldTenantMembershipIsolation.Designer.cs \
            TransportERP.Infrastructure/Persistence/Migrations/TransportErpDbContextModelSnapshot.cs \
            TransportERP.Infrastructure/Persistence/Migrations/GreenfieldDbp002PhysicalSql.cs \
            | tee evidence/candidate-source-sha256.txt

      - name: Restore build EF CLI no-model-drift and generated SQL
        shell: bash
        env:
          TRANSPORTERP_DESIGN_CONNSTR: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres;Include Error Detail=true
        run: |
          set -euo pipefail
          dotnet restore TransportERP.Tests/TransportERP.Tests.csproj | tee evidence/restore.log
          dotnet build TransportERP.Tests/TransportERP.Tests.csproj -c Release --no-restore | tee evidence/build.log
          dotnet tool install --global dotnet-ef --version 10.0.0
          dotnet ef migrations has-pending-model-changes \
            --project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj \
            --startup-project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj \
            | tee evidence/no-model-drift.log
          grep -q 'No changes have been made to the model since the last migration' evidence/no-model-drift.log
          dotnet ef migrations script "$BASELINE_MIGRATION" "$CANDIDATE_MIGRATION" \
            --project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj \
            --startup-project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj \
            --output evidence/migration11-generated.sql
          test -s evidence/migration11-generated.sql
          grep -q 'user_memberships' evidence/migration11-generated.sql
          grep -q 'ENABLE ROW LEVEL SECURITY' evidence/migration11-generated.sql
          grep -q 'FORCE ROW LEVEL SECURITY' evidence/migration11-generated.sql
          sha256sum evidence/migration11-generated.sql | tee evidence/migration11-generated.sql.sha256

      - name: Apply exactly ten original migrations to fresh empty baseline
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$PGCID" createdb -U postgres mission03_baseline
          export TRANSPORTERP_DESIGN_CONNSTR='Host=127.0.0.1;Port=5432;Database=mission03_baseline;Username=postgres;Password=postgres;Include Error Detail=true'
          dotnet ef database update "$BASELINE_MIGRATION" \
            --project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj \
            --startup-project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj \
            | tee evidence/baseline-10.log
          docker exec "$PGCID" psql -U postgres -d mission03_baseline -At -c 'SELECT "MigrationId" FROM transport_erp."__EFMigrationsHistory" ORDER BY "MigrationId";' | tee evidence/baseline-history.txt
          test "$(wc -l < evidence/baseline-history.txt)" -eq 10
          test "$(tail -n1 evidence/baseline-history.txt)" = "$BASELINE_MIGRATION"
          ! grep -q "$CANDIDATE_MIGRATION" evidence/baseline-history.txt

      - name: Baseline catalog backup restore reconciliation
        shell: bash
        run: |
          set -euo pipefail
          capture() {
            local db="$1" p="$2"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -F '|' -c "SELECT n.nspname,c.relname,c.relkind,c.relrowsecurity,c.relforcerowsecurity FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='transport_erp' AND c.relkind IN ('r','p') ORDER BY 1,2;" > "evidence/${p}-tables.txt"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -F '|' -c "SELECT table_name,column_name,data_type,is_nullable,coalesce(column_default,'') FROM information_schema.columns WHERE table_schema='transport_erp' ORDER BY table_name,ordinal_position;" > "evidence/${p}-columns.txt"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -F '|' -c "SELECT c.relname,con.conname,con.contype,con.condeferrable,con.condeferred,pg_get_constraintdef(con.oid,true) FROM pg_constraint con JOIN pg_class c ON c.oid=con.conrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='transport_erp' ORDER BY c.relname,con.conname;" > "evidence/${p}-constraints.txt"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -F '|' -c "SELECT tablename,indexname,indexdef FROM pg_indexes WHERE schemaname='transport_erp' ORDER BY tablename,indexname;" > "evidence/${p}-indexes.txt"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -F '|' -c "SELECT tablename,policyname,cmd,coalesce(qual,''),coalesce(with_check,'') FROM pg_policies WHERE schemaname='transport_erp' ORDER BY tablename,policyname;" > "evidence/${p}-policies.txt"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -c 'SELECT "MigrationId" FROM transport_erp."__EFMigrationsHistory" ORDER BY "MigrationId";' > "evidence/${p}-history.txt"
          }
          capture mission03_baseline baseline
          docker exec "$PGCID" pg_dump -U postgres -Fc mission03_baseline > evidence/baseline.dump
          docker exec "$PGCID" createdb -U postgres mission03_baseline_restore
          cat evidence/baseline.dump | docker exec -i "$PGCID" pg_restore -U postgres -d mission03_baseline_restore
          capture mission03_baseline_restore baseline-restore
          for x in tables columns constraints indexes policies history; do diff -u "evidence/baseline-${x}.txt" "evidence/baseline-restore-${x}.txt"; done
          sha256sum evidence/baseline.dump | tee evidence/baseline.dump.sha256

      - name: Execute generated SQL on restored ten-migration baseline
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$PGCID" createdb -U postgres mission03_sql_candidate
          cat evidence/baseline.dump | docker exec -i "$PGCID" pg_restore -U postgres -d mission03_sql_candidate
          cat evidence/migration11-generated.sql | docker exec -i "$PGCID" psql -v ON_ERROR_STOP=1 -U postgres -d mission03_sql_candidate | tee evidence/generated-sql-execution.log
          docker exec "$PGCID" psql -U postgres -d mission03_sql_candidate -At -c 'SELECT "MigrationId" FROM transport_erp."__EFMigrationsHistory" ORDER BY "MigrationId";' | tee evidence/sql-candidate-history.txt
          test "$(wc -l < evidence/sql-candidate-history.txt)" -eq 11
          test "$(tail -n1 evidence/sql-candidate-history.txt)" = "$CANDIDATE_MIGRATION"

      - name: Apply ten then Migration 11 via EF on second fresh empty database
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$PGCID" createdb -U postgres mission03_candidate
          export TRANSPORTERP_DESIGN_CONNSTR='Host=127.0.0.1;Port=5432;Database=mission03_candidate;Username=postgres;Password=postgres;Include Error Detail=true'
          dotnet ef database update "$BASELINE_MIGRATION" --project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj --startup-project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj | tee evidence/candidate-first-ten.log
          docker exec "$PGCID" psql -U postgres -d mission03_candidate -At -c 'SELECT "MigrationId" FROM transport_erp."__EFMigrationsHistory" ORDER BY "MigrationId";' > evidence/candidate-before-11-history.txt
          test "$(wc -l < evidence/candidate-before-11-history.txt)" -eq 10
          dotnet ef database update "$CANDIDATE_MIGRATION" --project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj --startup-project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj | tee evidence/candidate-migration11.log
          docker exec "$PGCID" psql -U postgres -d mission03_candidate -At -c 'SELECT "MigrationId" FROM transport_erp."__EFMigrationsHistory" ORDER BY "MigrationId";' | tee evidence/candidate-history.txt
          test "$(wc -l < evidence/candidate-history.txt)" -eq 11
          test "$(tail -n1 evidence/candidate-history.txt)" = "$CANDIDATE_MIGRATION"

      - name: RLS FK index catalog roles functions and ACL gate
        shell: bash
        run: |
          set -euo pipefail
          q() { docker exec "$PGCID" psql -v ON_ERROR_STOP=1 -U postgres -d mission03_candidate -At -c "$1"; }
          # All non-global ordinary application tables are FORCE-RLS. Global lookup tables remain non-RLS.
          test "$(q "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='transport_erp' AND c.relkind='r' AND c.relname NOT IN ('currencies','permissions','global_settings','__EFMigrationsHistory') AND (NOT c.relrowsecurity OR NOT c.relforcerowsecurity);")" = "0"
          test "$(q "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='transport_erp' AND c.relname IN ('currencies','permissions','global_settings') AND c.relrowsecurity;")" = "0"
          test "$(q "SELECT count(*) FROM pg_roles WHERE rolname IN ('transporterp_schema_owner','transporterp_migrator','transporterp_app','transporterp_worker','transporterp_readonly') AND NOT rolcanlogin AND NOT rolbypassrls;")" = "5"
          test "$(q "SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='transport_erp' AND p.proname IN ('current_user_id','current_membership_id','current_company_id','current_branch_id','current_session_id','current_device_id','current_security_version') AND NOT p.prosecdef AND array_to_string(p.proconfig,',') LIKE '%search_path=%';")" = "7"
          test "$(q "SELECT count(*) FROM pg_namespace n CROSS JOIN LATERAL aclexplode(COALESCE(n.nspacl,acldefault('n',n.nspowner))) a WHERE n.nspname='transport_erp' AND a.grantee=0 AND a.privilege_type='CREATE';")" = "0"
          test "$(q "SELECT has_table_privilege('transporterp_app','transport_erp.user_roles','INSERT') OR has_table_privilege('transporterp_app','transport_erp.user_permission_overrides','INSERT');")" = "f"
          test "$(q "SELECT count(*) FROM pg_constraint con JOIN pg_class c ON c.oid=con.conrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='transport_erp' AND c.relname IN ('user_memberships','user_role_grants','user_permission_grants') AND con.contype='f';")" -ge 10
          test "$(q "SELECT count(*) FROM pg_trigger t JOIN pg_constraint con ON con.oid=t.tgconstraint JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='transport_erp' AND c.relname IN ('user_role_grants','user_permission_grants') AND NOT t.tgisinternal AND con.condeferrable AND con.condeferred;")" = "3"
          test "$(q "SELECT count(*) FROM pg_indexes WHERE schemaname='transport_erp' AND indexname='IX_user_memberships_UserId_CompanyId_BranchId' AND indexdef ILIKE '%NULLS NOT DISTINCT%';")" = "1"
          test "$(q "SELECT count(*) FROM pg_indexes WHERE schemaname='transport_erp' AND indexname IN ('IX_user_permission_grants_MembershipId_PermissionId','IX_user_role_grants_MembershipId_RoleId') AND indexdef ILIKE '%Status%ACTIVE%';")" = "2"
          q "SELECT c.relname,c.relrowsecurity,c.relforcerowsecurity FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='transport_erp' AND c.relkind='r' ORDER BY c.relname;" | tee evidence/rls-catalog.txt
          q "SELECT c.relname,con.conname,con.contype,con.condeferrable,con.condeferred,pg_get_constraintdef(con.oid,true) FROM pg_constraint con JOIN pg_class c ON c.oid=con.conrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='transport_erp' AND c.relname IN ('user_memberships','user_role_grants','user_permission_grants') ORDER BY c.relname,con.conname;" | tee evidence/dbp002-constraints.txt
          q "SELECT tablename,indexname,indexdef FROM pg_indexes WHERE schemaname='transport_erp' AND tablename IN ('user_memberships','user_role_grants','user_permission_grants') ORDER BY tablename,indexname;" | tee evidence/dbp002-indexes.txt
          q "SELECT rolname,rolcanlogin,rolbypassrls FROM pg_roles WHERE rolname LIKE 'transporterp_%' ORDER BY rolname;" | tee evidence/runtime-roles.txt

      - name: Seed two isolated tenants and create disposable RLS probe
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/seed.sql <<'SQL'
          INSERT INTO transport_erp.currencies ("Id","Code","NameAr","NameEn","MinorUnit","IsBase","Status","CreatedAt","UpdatedAt","RowVersion") VALUES
            ('00000000-0000-0000-0000-000000000001','YER','YER',NULL,2,true,'ACTIVE',now(),now(),decode('','hex'));
          INSERT INTO transport_erp.companies ("Id","Code","LegalNameAr","LegalNameEn","TaxIdentifier","BaseCurrencyId","DefaultCalendarId","Status","CreatedAt","UpdatedAt","RowVersion") VALUES
            ('10000000-0000-0000-0000-000000000001','A','Tenant A',NULL,NULL,'00000000-0000-0000-0000-000000000001','90000000-0000-0000-0000-000000000001','ACTIVE',now(),now(),decode('','hex')),
            ('20000000-0000-0000-0000-000000000001','B','Tenant B',NULL,NULL,'00000000-0000-0000-0000-000000000001','90000000-0000-0000-0000-000000000002','ACTIVE',now(),now(),decode('','hex'));
          INSERT INTO transport_erp.branches ("Id","CompanyId","Code","NameAr","NameEn","BranchType","Address","Timezone","Status","CreatedAt","UpdatedAt","RowVersion") VALUES
            ('11000000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000001','A1','A Branch',NULL,NULL,NULL,'UTC','ACTIVE',now(),now(),decode('','hex')),
            ('22000000-0000-0000-0000-000000000001','20000000-0000-0000-0000-000000000001','B1','B Branch',NULL,NULL,NULL,'UTC','ACTIVE',now(),now(),decode('','hex'));
          INSERT INTO transport_erp.users ("Id","UserName","NormalizedUserName","DisplayName","Email","Phone","PasswordHash","Status","CompanyId","BranchId","LastLoginAt","DeletedAt","CreatedAt","UpdatedAt","RowVersion") VALUES
            ('11100000-0000-0000-0000-000000000001','usera','USERA','User A',NULL,NULL,'x','ACTIVE','10000000-0000-0000-0000-000000000001','11000000-0000-0000-0000-000000000001',NULL,NULL,now(),now(),decode('','hex')),
            ('22200000-0000-0000-0000-000000000001','userb','USERB','User B',NULL,NULL,'x','ACTIVE','20000000-0000-0000-0000-000000000001','22000000-0000-0000-0000-000000000001',NULL,NULL,now(),now(),decode('','hex'));
          INSERT INTO transport_erp.permissions ("Id","Code","NameAr","Resource","Action","ScopeType","IsSystem","Status","DeletedAt","CreatedAt","UpdatedAt","RowVersion") VALUES
            ('30000000-0000-0000-0000-000000000001','TEST.READ','Read','TEST','READ','BRANCH',true,'ACTIVE',NULL,now(),now(),decode('','hex'));
          INSERT INTO transport_erp.roles ("Id","Code","NameAr","NameEn","Description","IsSystem","CompanyId","Status","DeletedAt","CreatedAt","UpdatedAt","RowVersion") VALUES
            ('31000000-0000-0000-0000-000000000001','ROLE.A','Role A',NULL,NULL,false,'10000000-0000-0000-0000-000000000001','ACTIVE',NULL,now(),now(),decode('','hex')),
            ('32000000-0000-0000-0000-000000000001','ROLE.B','Role B',NULL,NULL,false,'20000000-0000-0000-0000-000000000001','ACTIVE',NULL,now(),now(),decode('','hex'));
          INSERT INTO transport_erp.user_memberships ("Id","UserId","CompanyId","BranchId","ScopeType","Status","SecurityVersion","ValidFrom","ValidTo","CreatedAt","UpdatedAt","CreatedBy","RevokedBy","RevokeReason","ConcurrencyVersion") VALUES
            ('11110000-0000-0000-0000-000000000001','11100000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000001','11000000-0000-0000-0000-000000000001','BRANCH','ACTIVE',1,now(),NULL,now(),now(),'11100000-0000-0000-0000-000000000001',NULL,NULL,1),
            ('22220000-0000-0000-0000-000000000001','22200000-0000-0000-0000-000000000001','20000000-0000-0000-0000-000000000001','22000000-0000-0000-0000-000000000001','BRANCH','ACTIVE',1,now(),NULL,now(),now(),'22200000-0000-0000-0000-000000000001',NULL,NULL,1);
          INSERT INTO transport_erp.user_permission_grants ("Id","MembershipId","UserId","CompanyId","BranchId","PermissionId","Effect","Status","ValidFrom","ValidTo","GrantedBy","RevokedBy","Reason","CreatedAt","UpdatedAt","ConcurrencyVersion") VALUES
            ('41000000-0000-0000-0000-000000000001','11110000-0000-0000-0000-000000000001','11100000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000001','11000000-0000-0000-0000-000000000001','30000000-0000-0000-0000-000000000001','ALLOW','ACTIVE',now(),NULL,'11100000-0000-0000-0000-000000000001',NULL,NULL,now(),now(),1),
            ('42000000-0000-0000-0000-000000000001','22220000-0000-0000-0000-000000000001','22200000-0000-0000-0000-000000000001','20000000-0000-0000-0000-000000000001','22000000-0000-0000-0000-000000000001','30000000-0000-0000-0000-000000000001','ALLOW','ACTIVE',now(),NULL,'22200000-0000-0000-0000-000000000001',NULL,NULL,now(),now(),1);
          DO $$BEGIN IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='mission03_rls_probe') THEN CREATE ROLE mission03_rls_probe NOLOGIN NOBYPASSRLS; END IF; END$$;
          GRANT transporterp_app TO mission03_rls_probe;
          SQL
          docker exec -i "$PGCID" psql -v ON_ERROR_STOP=1 -U postgres -d mission03_candidate < /tmp/seed.sql | tee evidence/seed.log
          docker exec "$PGCID" psql -U postgres -d mission03_candidate -At -c 'SELECT "CompanyId",count(*) FROM transport_erp.user_memberships GROUP BY "CompanyId" ORDER BY "CompanyId";' | tee evidence/seed-memberships.txt

      - name: Raw SQL cross-tenant and fail-closed negative gate
        shell: bash
        run: |
          set -euo pipefail
          q() { docker exec "$PGCID" psql -v ON_ERROR_STOP=1 -U postgres -d mission03_candidate -At -c "$1"; }
          A="SET ROLE mission03_rls_probe; SELECT set_config('app.user_id','11100000-0000-0000-0000-000000000001',false); SELECT set_config('app.membership_id','11110000-0000-0000-0000-000000000001',false); SELECT set_config('app.company_id','10000000-0000-0000-0000-000000000001',false); SELECT set_config('app.branch_id','11000000-0000-0000-0000-000000000001',false); SELECT set_config('app.security_version','1',false);"
          B="SET ROLE mission03_rls_probe; SELECT set_config('app.user_id','22200000-0000-0000-0000-000000000001',false); SELECT set_config('app.membership_id','22220000-0000-0000-0000-000000000001',false); SELECT set_config('app.company_id','20000000-0000-0000-0000-000000000001',false); SELECT set_config('app.branch_id','22000000-0000-0000-0000-000000000001',false); SELECT set_config('app.security_version','1',false);"
          test "$(q "$A SELECT count(*) FROM transport_erp.user_memberships;")" = "1"
          test "$(q "$A SELECT count(*) FROM transport_erp.user_memberships WHERE \"CompanyId\"='20000000-0000-0000-0000-000000000001';")" = "0"
          test "$(q "$B SELECT count(*) FROM transport_erp.user_memberships;")" = "1"
          test "$(q "$B SELECT count(*) FROM transport_erp.user_memberships WHERE \"CompanyId\"='10000000-0000-0000-0000-000000000001';")" = "0"
          test "$(q "$A SELECT count(*) FROM transport_erp.companies;")" = "1"
          test "$(q "$B SELECT count(*) FROM transport_erp.companies;")" = "1"
          if q "$A INSERT INTO transport_erp.user_memberships (\"Id\",\"UserId\",\"CompanyId\",\"BranchId\",\"ScopeType\",\"Status\",\"SecurityVersion\",\"ValidFrom\",\"CreatedAt\",\"UpdatedAt\",\"CreatedBy\",\"ConcurrencyVersion\") VALUES ('99990000-0000-0000-0000-000000000001','22200000-0000-0000-0000-000000000001','20000000-0000-0000-0000-000000000001','22000000-0000-0000-0000-000000000001','BRANCH','ACTIVE',1,now(),now(),now(),'22200000-0000-0000-0000-000000000001',1);" > /tmp/cross-insert.log 2>&1; then echo 'cross-tenant insert unexpectedly succeeded' >&2; exit 1; else cat /tmp/cross-insert.log > evidence/cross-tenant-insert-negative.txt; fi
          test "$(q "$A UPDATE transport_erp.user_memberships SET \"UpdatedAt\"=now() WHERE \"CompanyId\"='20000000-0000-0000-0000-000000000001'; SELECT count(*) FROM transport_erp.user_memberships WHERE \"CompanyId\"='20000000-0000-0000-0000-000000000001';")" = "0"
          test "$(q "$B UPDATE transport_erp.user_memberships SET \"UpdatedAt\"=now() WHERE \"CompanyId\"='10000000-0000-0000-0000-000000000001'; SELECT count(*) FROM transport_erp.user_memberships WHERE \"CompanyId\"='10000000-0000-0000-0000-000000000001';")" = "0"
          test "$(q "SET ROLE mission03_rls_probe; RESET app.user_id; RESET app.membership_id; RESET app.company_id; RESET app.branch_id; RESET app.security_version; SELECT count(*) FROM transport_erp.user_memberships;")" = "0"
          test "$(q "SET ROLE mission03_rls_probe; SELECT set_config('app.user_id','bad',false); SELECT set_config('app.membership_id','bad',false); SELECT set_config('app.company_id','bad',false); SELECT set_config('app.branch_id','bad',false); SELECT set_config('app.security_version','bad',false); SELECT count(*) FROM transport_erp.user_memberships;")" = "0"
          test "$(q "SET ROLE mission03_rls_probe; SELECT set_config('app.user_id','11100000-0000-0000-0000-000000000001',false); SELECT set_config('app.membership_id','11110000-0000-0000-0000-000000000001',false); SELECT set_config('app.company_id','10000000-0000-0000-0000-000000000001',false); SELECT set_config('app.branch_id','11000000-0000-0000-0000-000000000001',false); SELECT set_config('app.security_version','2',false); SELECT count(*) FROM transport_erp.user_memberships;")" = "0"
          if q "BEGIN; INSERT INTO transport_erp.user_permission_grants (\"Id\",\"MembershipId\",\"UserId\",\"CompanyId\",\"BranchId\",\"PermissionId\",\"Effect\",\"Status\",\"ValidFrom\",\"GrantedBy\",\"CreatedAt\",\"UpdatedAt\",\"ConcurrencyVersion\") VALUES ('43000000-0000-0000-0000-000000000001','11110000-0000-0000-0000-000000000001','11100000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000001',NULL,'30000000-0000-0000-0000-000000000001','DENY','ACTIVE',now(),'11100000-0000-0000-0000-000000000001',now(),now(),1); SET CONSTRAINTS ALL IMMEDIATE; COMMIT;" > /tmp/branch-mismatch.log 2>&1; then echo 'branch mismatch unexpectedly succeeded' >&2; exit 1; else cat /tmp/branch-mismatch.log > evidence/branch-mismatch-negative.txt; fi
          if q "BEGIN; INSERT INTO transport_erp.user_role_grants (\"Id\",\"MembershipId\",\"UserId\",\"CompanyId\",\"BranchId\",\"RoleId\",\"Status\",\"ValidFrom\",\"GrantedBy\",\"CreatedAt\",\"UpdatedAt\",\"ConcurrencyVersion\") VALUES ('44000000-0000-0000-0000-000000000001','11110000-0000-0000-0000-000000000001','11100000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000001','11000000-0000-0000-0000-000000000001','32000000-0000-0000-0000-000000000001','ACTIVE',now(),'11100000-0000-0000-0000-000000000001',now(),now(),1); SET CONSTRAINTS ALL IMMEDIATE; COMMIT;" > /tmp/role-mismatch.log 2>&1; then echo 'role/company mismatch unexpectedly succeeded' >&2; exit 1; else cat /tmp/role-mismatch.log > evidence/role-company-mismatch-negative.txt; fi
          printf 'PASS A->B B->A raw SQL, missing/malformed/stale context, branch/role mismatch negatives\n' | tee evidence/raw-sql-negative-summary.txt

      - name: Reconcile generated-SQL and EF physical state
        shell: bash
        run: |
          set -euo pipefail
          capture() {
            local db="$1" p="$2"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -F '|' -c "SELECT n.nspname,c.relname,c.relkind,c.relrowsecurity,c.relforcerowsecurity FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='transport_erp' AND c.relkind IN ('r','p') ORDER BY 1,2;" > "evidence/${p}-tables.txt"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -F '|' -c "SELECT table_name,column_name,data_type,is_nullable,coalesce(column_default,'') FROM information_schema.columns WHERE table_schema='transport_erp' ORDER BY table_name,ordinal_position;" > "evidence/${p}-columns.txt"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -F '|' -c "SELECT c.relname,con.conname,con.contype,con.condeferrable,con.condeferred,pg_get_constraintdef(con.oid,true) FROM pg_constraint con JOIN pg_class c ON c.oid=con.conrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='transport_erp' ORDER BY c.relname,con.conname;" > "evidence/${p}-constraints.txt"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -F '|' -c "SELECT tablename,indexname,indexdef FROM pg_indexes WHERE schemaname='transport_erp' ORDER BY tablename,indexname;" > "evidence/${p}-indexes.txt"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -F '|' -c "SELECT tablename,policyname,cmd,coalesce(qual,''),coalesce(with_check,'') FROM pg_policies WHERE schemaname='transport_erp' ORDER BY tablename,policyname;" > "evidence/${p}-policies.txt"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -c 'SELECT "MigrationId" FROM transport_erp."__EFMigrationsHistory" ORDER BY "MigrationId";' > "evidence/${p}-history.txt"
          }
          capture mission03_candidate ef-candidate
          capture mission03_sql_candidate sql-candidate
          for x in tables columns constraints indexes policies history; do diff -u "evidence/ef-candidate-${x}.txt" "evidence/sql-candidate-${x}.txt"; done

      - name: Full regression on third fresh PostgreSQL 18.6 database
        shell: bash
        env:
          TRANSPORTERP_TEST_POSTGRESQL: Host=127.0.0.1;Port=5432;Database=mission03_regression;Username=postgres;Password=postgres;Include Error Detail=true
        run: |
          set -euo pipefail
          docker exec "$PGCID" createdb -U postgres mission03_regression
          dotnet test TransportERP.Tests/TransportERP.Tests.csproj -c Release --no-restore --logger 'trx;LogFileName=dbp002-full-regression.trx' | tee evidence/full-regression.log
          grep -Eq 'Passed!|Passed:' evidence/full-regression.log
          find TransportERP.Tests -name dbp002-full-regression.trx -exec cp {} evidence/ \; || true

      - name: Candidate backup restore and final reconciliation
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$PGCID" pg_dump -U postgres -Fc mission03_candidate > evidence/candidate.dump
          docker exec "$PGCID" createdb -U postgres mission03_candidate_restore
          cat evidence/candidate.dump | docker exec -i "$PGCID" pg_restore -U postgres -d mission03_candidate_restore
          capture() {
            local db="$1" p="$2"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -F '|' -c "SELECT n.nspname,c.relname,c.relkind,c.relrowsecurity,c.relforcerowsecurity FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='transport_erp' AND c.relkind IN ('r','p') ORDER BY 1,2;" > "evidence/${p}-tables.txt"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -F '|' -c "SELECT table_name,column_name,data_type,is_nullable,coalesce(column_default,'') FROM information_schema.columns WHERE table_schema='transport_erp' ORDER BY table_name,ordinal_position;" > "evidence/${p}-columns.txt"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -F '|' -c "SELECT c.relname,con.conname,con.contype,con.condeferrable,con.condeferred,pg_get_constraintdef(con.oid,true) FROM pg_constraint con JOIN pg_class c ON c.oid=con.conrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='transport_erp' ORDER BY c.relname,con.conname;" > "evidence/${p}-constraints.txt"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -F '|' -c "SELECT tablename,indexname,indexdef FROM pg_indexes WHERE schemaname='transport_erp' ORDER BY tablename,indexname;" > "evidence/${p}-indexes.txt"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -F '|' -c "SELECT tablename,policyname,cmd,coalesce(qual,''),coalesce(with_check,'') FROM pg_policies WHERE schemaname='transport_erp' ORDER BY tablename,policyname;" > "evidence/${p}-policies.txt"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -c 'SELECT "MigrationId" FROM transport_erp."__EFMigrationsHistory" ORDER BY "MigrationId";' > "evidence/${p}-history.txt"
            docker exec "$PGCID" psql -U postgres -d "$db" -At -F '|' -c 'SELECT "CompanyId",count(*) FROM transport_erp.user_memberships GROUP BY "CompanyId" ORDER BY "CompanyId";' > "evidence/${p}-membership-counts.txt"
          }
          capture mission03_candidate final-source
          capture mission03_candidate_restore final-restore
          for x in tables columns constraints indexes policies history membership-counts; do diff -u "evidence/final-source-${x}.txt" "evidence/final-restore-${x}.txt"; done
          sha256sum evidence/candidate.dump | tee evidence/candidate.dump.sha256
          find evidence -type f ! -name EVIDENCE_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > evidence/EVIDENCE_SHA256.txt
          printf 'DBP-002 TECHNICAL REHEARSAL PASS\nHEAD=%s\nTREE=%s\nPARENT=%s\n' "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" "$(git rev-parse HEAD^)" | tee evidence/DBP002_TECHNICAL_PASS.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mission-03-dbp002-rehearsal-v2-${{ github.sha }}
          path: evidence
          if-no-files-found: error
