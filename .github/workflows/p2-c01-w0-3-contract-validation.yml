name: P2 C01 W0-3 contract validation

on:
  push:
    branches:
      - contracts/p2-c01-w0-3-20260820
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  validate-contracts:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate W1 W2 W3 UAT security and traceability
        run: python documentation/closeout/P2/validate_p2_c01_contracts.py

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore TransportERP.Tests/TransportERP.Tests.csproj

      - name: Run P1 and recovered foundation tests
        run: dotnet test TransportERP.Tests/TransportERP.Tests.csproj --configuration Debug --no-restore --filter "Category!=P2PostgreSQL"
