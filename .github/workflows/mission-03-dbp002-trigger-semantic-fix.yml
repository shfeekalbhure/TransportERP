name: MISSION-03 DBP-002 Trigger Semantic Reconcile Fix

on:
  push:
    branches:
      - codex/mission-03-execution-20260828
    paths:
      - .github/workflows/mission-03-dbp002-trigger-semantic-fix.yml

permissions:
  contents: write

jobs:
  patch-trigger-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Normalize only PostgreSQL-generated internal trigger identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/mission-03-dbp002-rehearsal-v3.sh')
          s = p.read_text()
          old = '''  psqlq "$db" "SELECT c.relname,t.tgname,t.tgenabled,t.tgisinternal,t.tgdeferrable,t.tginitdeferred,t.tgtype,COALESCE(con.conname,'') FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace LEFT JOIN pg_constraint con ON con.oid=t.tgconstraint WHERE n.nspname='transport_erp' ORDER BY c.relname,t.tgname;" > "evidence/${p}-triggers.struct"'''
          new = '''  psqlq "$db" "SELECT c.relname,CASE WHEN t.tgisinternal THEN '<internal>' ELSE t.tgname END,t.tgenabled,t.tgisinternal,t.tgdeferrable,t.tginitdeferred,t.tgtype,COALESCE(con.conname,'') FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace LEFT JOIN pg_constraint con ON con.oid=t.tgconstraint WHERE n.nspname='transport_erp' ORDER BY c.relname,t.tgisinternal,COALESCE(con.conname,''),t.tgtype,CASE WHEN t.tgisinternal THEN '' ELSE t.tgname END;" > "evidence/${p}-triggers.struct"'''
          if old not in s:
              raise SystemExit('Expected trigger structural signature source not found')
          s = s.replace(old, new)
          raw_anchor = '''  psqlq "$db" "SELECT table_name,ordinal_position,column_name,COALESCE(column_default,'') FROM information_schema.columns WHERE table_schema='transport_erp' ORDER BY table_name,ordinal_position;" > "evidence/${p}-defaults.raw"'''
          raw_new = raw_anchor + '''\n  psqlq "$db" "SELECT c.relname,t.tgname,t.tgenabled,t.tgisinternal,t.tgdeferrable,t.tginitdeferred,t.tgtype,COALESCE(con.conname,'') FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace LEFT JOIN pg_constraint con ON con.oid=t.tgconstraint WHERE n.nspname='transport_erp' ORDER BY c.relname,t.tgname;" > "evidence/${p}-triggers.raw"'''
          if raw_anchor not in s:
              raise SystemExit('Expected raw evidence anchor not found')
          s = s.replace(raw_anchor, raw_new)
          p.write_text(s)
          PY
          git diff --check
          git add scripts/mission-03-dbp002-rehearsal-v3.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'MISSION-03 DBP-002: normalize internal trigger identities semantically'
          git push origin "HEAD:${GITHUB_REF_NAME}"
