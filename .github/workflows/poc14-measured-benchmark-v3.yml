name: POC14 measured database benchmark v3
on:
  push:
    branches: [poc/poc14-measured-benchmark]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measured-pilot-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Baseline and clients
        run: |
          mkdir -p poc14-results-v3
          echo "GITHUB_SHA=$GITHUB_SHA" | tee poc14-results-v3/execution-revision.txt
          uname -a | tee poc14-results-v3/uname.txt
          lscpu | tee poc14-results-v3/lscpu.txt
          free -h | tee poc14-results-v3/memory.txt
          python3 -m pip install --disable-pip-version-check 'psycopg[binary]' mysql-connector-python
          python3 -m pip freeze | sort | tee poc14-results-v3/python-packages.txt
          docker pull postgis/postgis:18-3.6
          docker pull mysql:8.4.10
          docker image inspect postgis/postgis:18-3.6 --format '{{json .RepoDigests}}' | tee poc14-results-v3/postgres-image-digest.txt
          docker image inspect mysql:8.4.10 --format '{{json .RepoDigests}}' | tee poc14-results-v3/mysql-image-digest.txt
      - name: Five alternating measured repetitions
        shell: bash
        run: |
          set -euo pipefail
          pg_run() {
            r="$1"; docker rm -f poc14-pg >/dev/null 2>&1 || true
            docker run -d --name poc14-pg --cpus=2 --memory=2g -e POSTGRES_PASSWORD=poc14 -e POSTGRES_USER=poc14 -e POSTGRES_DB=poc14 -p 55432:5432 postgis/postgis:18-3.6 > poc14-results-v3/pg-container-${r}.txt
            for i in $(seq 1 120); do docker logs poc14-pg 2>&1 | grep -q "PostgreSQL init process complete" && break; sleep 1; done
            for i in $(seq 1 60); do docker exec poc14-pg pg_isready -U poc14 -d poc14 >/dev/null 2>&1 && break; sleep 1; done
            docker exec poc14-pg psql -U poc14 -d poc14 -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS postgis;" >/dev/null
            docker exec poc14-pg psql -U poc14 -d poc14 -Atc "select current_setting('server_version'), postgis_lib_version();" | tee poc14-results-v3/pg-runtime-version-${r}.txt
            if ! /usr/bin/time -v python3 poc14/benchmark.py --engine postgres --host 127.0.0.1 --port 55432 --user poc14 --password poc14 --database poc14 --run-id "pg-${r}" --output "poc14-results-v3/pg-${r}.json" 2> "poc14-results-v3/pg-time-${r}.txt"; then docker logs poc14-pg > "poc14-results-v3/pg-log-${r}.txt" 2>&1 || true; return 1; fi
            docker stats --no-stream poc14-pg | tee poc14-results-v3/pg-stats-${r}.txt
            docker logs poc14-pg > "poc14-results-v3/pg-log-${r}.txt" 2>&1 || true
            docker rm -f poc14-pg >/dev/null
          }
          my_run() {
            r="$1"; docker rm -f poc14-my >/dev/null 2>&1 || true
            docker run -d --name poc14-my --cpus=2 --memory=2g -e MYSQL_ROOT_PASSWORD=poc14root -e MYSQL_DATABASE=poc14 -e MYSQL_USER=poc14 -e MYSQL_PASSWORD=poc14 -p 53306:3306 mysql:8.4.10 > poc14-results-v3/my-container-${r}.txt
            for i in $(seq 1 180); do docker logs poc14-my 2>&1 | grep -q "MySQL init process done. Ready for start up." && break; sleep 1; done
            for i in $(seq 1 60); do docker exec poc14-my mysqladmin ping -h127.0.0.1 -uroot -ppoc14root --silent >/dev/null 2>&1 && break; sleep 1; done
            docker exec poc14-my mysql -uroot -ppoc14root -Nse "select version(), @@version_comment;" poc14 | tee poc14-results-v3/my-runtime-version-${r}.txt
            if ! /usr/bin/time -v python3 poc14/benchmark.py --engine mysql --host 127.0.0.1 --port 53306 --user poc14 --password poc14 --database poc14 --run-id "my-${r}" --output "poc14-results-v3/my-${r}.json" 2> "poc14-results-v3/my-time-${r}.txt"; then docker logs poc14-my > "poc14-results-v3/my-log-${r}.txt" 2>&1 || true; return 1; fi
            docker stats --no-stream poc14-my | tee poc14-results-v3/my-stats-${r}.txt
            docker logs poc14-my > "poc14-results-v3/my-log-${r}.txt" 2>&1 || true
            docker rm -f poc14-my >/dev/null
          }
          for r in 1 2 3 4 5; do if (( r % 2 == 1 )); then pg_run "$r"; my_run "$r"; else my_run "$r"; pg_run "$r"; fi; done
      - name: Aggregate
        if: always()
        run: |
          python3 - <<'PY'
          import glob,json,csv,statistics
          rows=[]
          for f in sorted(glob.glob('poc14-results-v3/*.json')):
            try: d=json.load(open(f))
            except: continue
            for r in d.get('results',[]): rows.append({'engine':d['engine'],'run_id':d['run_id'],'versions':' | '.join(d.get('versions',[])),'database_bytes':d.get('database_bytes'),'integrity_pass':d.get('mandatory_subset_integrity_pass'),'workload':r.get('workload'),'operations':r.get('operations'),'elapsed_s':r.get('elapsed_s'),'ops_per_s':r.get('ops_per_s'),'p50_ms':r.get('p50_ms'),'p95_ms':r.get('p95_ms'),'p99_ms':r.get('p99_ms')})
          if rows:
            with open('poc14-results-v3/measured-results.csv','w',newline='') as h: w=csv.DictWriter(h,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
            a={}
            for x in rows:a.setdefault((x['engine'],x['workload']),[]).append(float(x['ops_per_s']))
            with open('poc14-results-v3/median-throughput.csv','w',newline='') as h:
              w=csv.writer(h);w.writerow(['engine','workload','median_ops_per_s','repetitions'])
              for (e,wl),v in sorted(a.items()):w.writerow([e,wl,statistics.median(v),len(v)])
          print('json results',len(glob.glob('poc14-results-v3/*.json')))
          PY
          sha256sum poc14/MEASURED_EXECUTION_SUPPLEMENT_FREEZE.md poc14/benchmark.py .github/workflows/poc14-measured-benchmark-v3.yml | tee poc14-results-v3/execution-files-sha256.txt
      - name: Evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc14-measured-v3-${{ github.sha }}
          path: poc14-results-v3/
          retention-days: 30
