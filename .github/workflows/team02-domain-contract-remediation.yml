name: TEAM-02 domain contracts remediation

on:
  push:
    branches:
      - feature/p2-c01-c-release-trip-manifest-20260821
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-team02:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current C branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/p2-c01-c-release-trip-manifest-20260821

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply bounded TEAM-02 patch
        run: python tools/team02_domain_contract_remediate.py

      - name: Guard C-only scope and closed contracts
        shell: bash
        run: |
          git diff --name-only
          if git diff --name-only | grep -E '^documentation/closeout/P2/P2_C01_(W1|W2|W3)' ; then
            echo 'TEAM-02 must not modify closed W1/W2/W3.'
            exit 1
          fi
          if git diff --name-only | grep -E '/(Arrival|Warehouse|Delivery|Customs|Commission|Settlement|Fleet|GPS|Notification|ExceptionResolution)|(^|/)(Arrival|Warehouse|Delivery|Customs|Commission|Settlement|Fleet|GPS)' ; then
            echo 'TEAM-02 leaked into a later phase.'
            exit 1
          fi

      - name: Restore core tests
        run: dotnet restore TransportERP.Tests/TransportERP.Tests.csproj

      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.0

      - name: Generate additive C volume-contract migration
        env:
          TRANSPORTERP_DESIGN_CONNSTR: Host=localhost;Port=5432;Database=transporterptest;Username=postgres;Password=postgres
        run: |
          dotnet ef migrations add P2C01CWaybillVolumeContract \
            --project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj \
            --startup-project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj \
            --output-dir Persistence/Migrations

      - name: Verify model and compile
        env:
          TRANSPORTERP_DESIGN_CONNSTR: Host=localhost;Port=5432;Database=transporterptest;Username=postgres;Password=postgres
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj \
            --startup-project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj
          dotnet build TransportERP.Tests/TransportERP.Tests.csproj --configuration Debug --no-restore
          dotnet test TransportERP.Tests/TransportERP.Tests.csproj --configuration Debug --no-build --filter "Category!=P2PostgreSQL"

      - name: Commit bounded TEAM-02 remediation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/team02-domain-contract-remediation.yml tools/team02_domain_contract_remediate.py
          git add -- \
            TransportERP.Contracts/Waybills/WaybillContracts.cs \
            TransportERP/Waybills/WaybillAggregate.cs \
            TransportERP.Application/Waybills/WaybillApplicationService.cs \
            TransportERP.Infrastructure/Persistence/P2WaybillEntities.cs \
            TransportERP.Infrastructure/Persistence/WaybillPersistenceServices.cs \
            TransportERP.Infrastructure/Persistence/TransportErpP2ModelCustomizer.cs \
            TransportERP.Infrastructure/Persistence/ShippingExecutionPersistence.cs \
            TransportERP.Infrastructure/Persistence/Migrations \
            TransportERP.Tests/P2C01CShippingExecutionTests.cs \
            TransportERP.Tests/P2C01CPhysicalMeasurePostgreSqlTests.cs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'team02: close P2-C01-C volume and replay contracts'
          git push origin HEAD:feature/p2-c01-c-release-trip-manifest-20260821
