name: MISSION-03 DBP-002 Authoritative Test Seed Fix

on:
  push:
    branches:
      - codex/mission-03-execution-20260828
    paths:
      - .github/workflows/mission-03-dbp002-authoritative-test-seed-fix.yml

permissions:
  contents: write

jobs:
  patch-authority-seeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Move failing PostgreSQL fixtures to authoritative membership grants
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' ' gMSkK...TRUNCATED_FOR_TOOL_SAFETY...Cg==' | base64 -d > /tmp/dbp002-seed-fix.py
          python3 /tmp/dbp002-seed-fix.py
          git diff --check
          git diff -- TransportERP.Tests/SyncOperationPersistenceTests.cs TransportERP.Tests/ApiAuthenticationAndAuditTests.cs
          git add TransportERP.Tests/SyncOperationPersistenceTests.cs TransportERP.Tests/ApiAuthenticationAndAuditTests.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'MISSION-03 DBP-002: seed authoritative memberships in regression fixtures'
          git push origin "HEAD:${GITHUB_REF_NAME}"
