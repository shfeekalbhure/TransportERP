name: POC14R REM003 build evidence
on:
  push:
    branches: [poc/poc14r-rem003-build]
permissions:
  contents: read
jobs:
  build-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Verify exact build input and reconstruct
        shell: bash
        run: |
          set -euo pipefail
          for p in 00 01 02 04; do test $(wc -c < poc14r-rem003/piece_${p}.b64) -eq 7000; done
          test $(wc -c < poc14r-rem003/piece_03a.b64) -eq 3500
          test $(wc -c < poc14r-rem003/piece_03b.b64) -eq 3500
          test $(wc -c < poc14r-rem003/piece_05.b64) -eq 3284
          cat poc14r-rem003/piece_00.b64 poc14r-rem003/piece_01.b64 poc14r-rem003/piece_02.b64 poc14r-rem003/piece_03a.b64 poc14r-rem003/piece_03b.b64 poc14r-rem003/piece_04.b64 poc14r-rem003/piece_05.b64 | base64 -d > /tmp/rem003_ci_min.zip
          echo 'dd823312fdf7bc6bbdc18d49dcf46180ffc4036f8f1498bc928fd443508d912f  /tmp/rem003_ci_min.zip' | sha256sum -c -
          unzip -q /tmp/rem003_ci_min.zip -d /tmp/rem003
          chmod +x /tmp/rem003/rem003_ci_min/ci/rem003_ci.sh
      - name: Rebind REM003 final Freeze identity and contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/rem003/rem003_ci_min')
          old='POC14R-REM003-VF-20260814-2320-01'
          new='POC14R-REM003-VF-20260816-0528-01'
          old_contract='84e14a9e0938b74275087624ee7d2b00154d6401cf95267af07f94fa20951b32'
          contract=root/'sources/harness/TransportERP.Poc14R.Rerun9/rerun9_workloads.json'
          b=contract.read_bytes().replace(old.encode(),new.encode())
          contract.write_bytes(b)
          ch=hashlib.sha256(b).hexdigest()
          if ch!='2cf3ae275bcda0c9734ef4381b32604f2a0b9b5d8a92dc5884b7d8e175afc79c': raise SystemExit('CONTRACT_SHA_MISMATCH')
          bi=root/'REM003_BUILD_INPUT.json'
          bi.write_text(bi.read_text().replace(old,new).replace(old_contract,ch))
          p=root/'sources/harness/TransportERP.Poc14R.Rerun9/Program.cs'
          p.write_text(p.read_text().replace(old,new).replace(old_contract,ch))
          PY
          echo '2cf3ae275bcda0c9734ef4381b32604f2a0b9b5d8a92dc5884b7d8e175afc79c  /tmp/rem003/rem003_ci_min/sources/harness/TransportERP.Poc14R.Rerun9/rerun9_workloads.json' | sha256sum -c -
          echo '2769788b7e2cd2131815c89ccf7e0b1815c389c8e32dc92795c332f9a856e51a  /tmp/rem003/rem003_ci_min/REM003_BUILD_INPUT.json' | sha256sum -c -
          ! grep -R -F 'POC14R-REM003-VF-20260814-2320-01' /tmp/rem003/rem003_ci_min/REM003_BUILD_INPUT.json /tmp/rem003/rem003_ci_min/sources/harness/TransportERP.Poc14R.Rerun9/Program.cs /tmp/rem003/rem003_ci_min/sources/harness/TransportERP.Poc14R.Rerun9/rerun9_workloads.json
      - name: Apply REM003 Harness compile correction and bind source SHA
        shell: bash
        run: |
          set -euo pipefail
          P=/tmp/rem003/rem003_ci_min/sources/harness/TransportERP.Poc14R.Rerun9/Program.cs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/rem003/rem003_ci_min/sources/harness/TransportERP.Poc14R.Rerun9/Program.cs')
          s=p.read_text()
          s=s.replace('static object IdVal(string provider,string g)=>IdVal(provider,Guid.Parse(g));', 'static object IdText(string provider,string g)=>IdVal(provider,Guid.Parse(g));')
          s=s.replace('const string ContractSha256="2cf3ae275bcda0c9734ef4381b32604f2a0b9b5d8a92dc5884b7d8e175afc79c";\nvar mode=', 'const string ContractSha256="2cf3ae275bcda0c9734ef4381b32604f2a0b9b5d8a92dc5884b7d8e175afc79c";\nvar required=new[]{"W-001","W-014","W-016","W-017","W-018","W-021","W-022","W-028","W-029"};\nvar mode=')
          s=s.replace(' var required=new[]{"W-001","W-014","W-016","W-017","W-018","W-021","W-022","W-028","W-029"};\n', '')
          s=s.replace('IdVal(provider,company)', 'IdText(provider,company)')
          s=s.replace('IdVal(provider,branch)', 'IdText(provider,branch)')
          p.write_text(s)
          PY
          echo '349f4fbd1e14e8b7536713fabf69c5f009d64fd54e98012477244069cde325cf  /tmp/rem003/rem003_ci_min/sources/harness/TransportERP.Poc14R.Rerun9/Program.cs' | sha256sum -c -
      - name: Correct primary binary execution evidence binding
        shell: bash
        run: |
          set -euo pipefail
          TARGET=/tmp/rem003/rem003_ci_min/ci/rem003_ci.sh
          echo 'c52ab27addd0d07e426cf8f3096068cabec1419640d81f77a7b8fb2efa78ce7e  /tmp/rem003/rem003_ci_min/ci/rem003_ci.sh' | sha256sum -c -
          sha256sum poc14r-rem003/ci_execution_fix.py | tee /tmp/rem003_patch_tool.sha256
          python3 poc14r-rem003/ci_execution_fix.py "$TARGET"
          sha256sum "$TARGET" | tee /tmp/rem003_patched_ci_script.sha256
      - name: Restore build and path tests - non benchmark
        run: /tmp/rem003/rem003_ci_min/ci/rem003_ci.sh
      - name: Package evidence
        if: always()
        run: |
          ROOT=/tmp/rem003/rem003_ci_min
          test -d "$ROOT/ci_evidence"
          cp /tmp/rem003_patch_tool.sha256 "$ROOT/ci_evidence/14_PATCH_TOOL_SHA256.txt"
          cp /tmp/rem003_patched_ci_script.sha256 "$ROOT/ci_evidence/15_PATCHED_CI_SCRIPT_SHA256.txt"
          tar -C "$ROOT" -czf /tmp/poc14r-rem003-build-evidence.tar.gz ci_evidence
          sha256sum /tmp/poc14r-rem003-build-evidence.tar.gz > /tmp/poc14r-rem003-build-evidence.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc14r-rem003-build-evidence
          path: |
            /tmp/poc14r-rem003-build-evidence.tar.gz
            /tmp/poc14r-rem003-build-evidence.tar.gz.sha256
          if-no-files-found: error
