name: POC14R REM003 build evidence
on:
  push:
    branches: [poc/poc14r-rem003-build]
permissions:
  contents: read
jobs:
  build-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
