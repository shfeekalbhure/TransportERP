name: POC14R REM003 build evidence
on:
  push:
    branches: [poc/poc14r-rem003-build]
permissions:
  contents: read
jobs:
  build-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Verify exact build input and reconstruct
        shell: bash
        run: |
          set -euo pipefail
          for p in 00 01 02 04; do test $(wc -c < poc14r-rem003/piece_${p}.b64) -eq 7000; done
          test $(wc -c < poc14r-rem003/piece_03a.b64) -eq 3500
          test $(wc -c < poc14r-rem003/piece_03b.b64) -eq 3500
          test $(wc -c < poc14r-rem003/piece_05.b64) -eq 3284
          cat poc14r-rem003/piece_00.b64 poc14r-rem003/piece_01.b64 poc14r-rem003/piece_02.b64 poc14r-rem003/piece_03a.b64 poc14r-rem003/piece_03b.b64 poc14r-rem003/piece_04.b64 poc14r-rem003/piece_05.b64 | base64 -d > /tmp/rem003_ci_min.zip
          echo 'dd823312fdf7bc6bbdc18d49dcf46180ffc4036f8f1498bc928fd443508d912f  /tmp/rem003_ci_min.zip' | sha256sum -c -
          unzip -q /tmp/rem003_ci_min.zip -d /tmp/rem003
          chmod +x /tmp/rem003/rem003_ci_min/ci/rem003_ci.sh
      - name: Restore build and path tests - non benchmark
        run: /tmp/rem003/rem003_ci_min/ci/rem003_ci.sh
      - name: Package evidence
        if: always()
        run: |
          ROOT=/tmp/rem003/rem003_ci_min
          test -d "$ROOT/ci_evidence"
          tar -C "$ROOT" -czf /tmp/poc14r-rem003-build-evidence.tar.gz ci_evidence
          sha256sum /tmp/poc14r-rem003-build-evidence.tar.gz > /tmp/poc14r-rem003-build-evidence.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc14r-rem003-build-evidence
          path: |
            /tmp/poc14r-rem003-build-evidence.tar.gz
            /tmp/poc14r-rem003-build-evidence.tar.gz.sha256
          if-no-files-found: error
