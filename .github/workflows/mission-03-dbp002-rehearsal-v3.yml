name: MISSION-03 DBP-002 Full Rehearsal v3

on:
  push:
    branches:
      - codex/mission-03-execution-20260828

permissions:
  contents: read

jobs:
  dbp002-rehearsal-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Run exact-head DBP-002 end-to-end rehearsal
        shell: bash
        run: bash scripts/mission-03-dbp002-rehearsal-v3.sh

      - name: Upload DBP-002 v3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mission-03-dbp002-rehearsal-v3-${{ github.sha }}
          path: evidence
          if-no-files-found: error
