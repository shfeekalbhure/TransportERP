name: P2 C01 W0-5 shared kernel validation

on:
  push:
    branches:
      - foundation/p2-c01-w0-5-shared-kernel-20260820
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  shared-kernel:
    if: github.event_name != 'pull_request' || github.head_ref == 'foundation/p2-c01-w0-5-shared-kernel-20260820'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate W0-5 phase boundary
        run: python documentation/closeout/P2/validate_p2_c01_w0_5_shared_kernel.py

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore TransportERP.Tests/TransportERP.Tests.csproj

      - name: Run P1 Foundation and W0-5 tests
        run: dotnet test TransportERP.Tests/TransportERP.Tests.csproj --configuration Debug --no-restore
