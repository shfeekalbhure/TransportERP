name: MISSION-03 W0 Disposable Baseline

on:
  push:
    branches:
      - codex/mission-03-execution-20260828

permissions:
  contents: read

concurrency:
  group: mission-03-w0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-postgresql-api-mobile:
    name: W0 / Core + PostgreSQL + API + Mobile probes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transporterptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d transporterptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TRANSPORTERP_DESIGN_CONNSTR: Host=localhost;Port=5432;Database=transporterptest;Username=postgres;Password=postgres
      TRANSPORTERP_TEST_CONNSTR: Host=localhost;Port=5432;Database=transporterptest;Username=postgres;Password=postgres
      TRANSPORTERP_CONNECTION_STRING: Host=localhost;Port=5432;Database=transporterptest;Username=postgres;Password=postgres
      TRANSPORTERP_JWT_ISSUER: TransportERP.Mission03
      TRANSPORTERP_JWT_AUDIENCE: TransportERP.Mission03.Clients
      TRANSPORTERP_JWT_SIGNING_KEY: mission-03-disposable-only-signing-key-20260828
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5080
    steps:
      - name: Checkout exact execution SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Bind evidence to exact SHA and tree
        shell: bash
        run: |
          mkdir -p mission-03-artifacts
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          {
            echo "ref=${GITHUB_REF}"
            echo "sha=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "parent=$(git rev-parse HEAD^)"
            echo "status_begin"
            git status --short
            echo "status_end"
          } | tee mission-03-artifacts/exact-sha.txt

      - name: Capture disposable runtime and container evidence
        shell: bash
        run: |
          {
            uname -a
            docker version
            docker info
          } > mission-03-artifacts/container-runtime.txt 2>&1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Capture SDK and PostgreSQL readiness
        shell: bash
        run: |
          dotnet --info | tee mission-03-artifacts/dotnet-info.txt
          pg_isready -h localhost -p 5432 -U postgres -d transporterptest | tee mission-03-artifacts/postgresql-readiness.txt

      - name: Validate P0, P1, and closed P2 contracts
        shell: bash
        run: |
          python documentation/closeout/validate_p0_p1.py | tee mission-03-artifacts/validate-p0-p1.txt
          python documentation/closeout/P2/validate_p2_c01_contracts.py | tee mission-03-artifacts/validate-p2-c01.txt

      - name: Restore core, API, and Mobile projects
        shell: bash
        run: |
          dotnet restore TransportERP.Tests/TransportERP.Tests.csproj | tee mission-03-artifacts/restore-tests.txt
          dotnet restore TransportERP.Api/TransportERP.Api.csproj | tee mission-03-artifacts/restore-api.txt
          for project in TransportERP.Mobile.Admin TransportERP.Mobile.Customer TransportERP.Mobile.Driver; do
            dotnet restore "$project/$project.csproj" | tee "mission-03-artifacts/restore-$project.txt"
          done

      - name: Build core runtime, tests, API, and Mobile probes
        shell: bash
        run: |
          dotnet build TransportERP.Tests/TransportERP.Tests.csproj --configuration Release --no-restore | tee mission-03-artifacts/build-tests.txt
          dotnet build TransportERP.Api/TransportERP.Api.csproj --configuration Release --no-restore | tee mission-03-artifacts/build-api.txt
          for project in TransportERP.Mobile.Admin TransportERP.Mobile.Customer TransportERP.Mobile.Driver; do
            dotnet msbuild "$project/$project.csproj" -getProperty:TargetFramework -getProperty:OutputType -getProperty:MauiRuntimeReady > "mission-03-artifacts/probe-$project.txt"
            dotnet build "$project/$project.csproj" --configuration Release --no-restore | tee "mission-03-artifacts/build-$project.txt"
          done

      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.0

      - name: Verify migration lineage and apply to disposable PostgreSQL
        shell: bash
        run: |
          dotnet ef migrations list --project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj --startup-project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj | tee mission-03-artifacts/migrations-list.txt
          dotnet ef migrations has-pending-model-changes --project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj --startup-project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj | tee mission-03-artifacts/migrations-model-check.txt
          dotnet ef database update --project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj --startup-project TransportERP.Infrastructure/TransportERP.Infrastructure.csproj | tee mission-03-artifacts/migrations-apply.txt

      - name: Run complete test suite against disposable PostgreSQL
        shell: bash
        run: |
          dotnet test TransportERP.Tests/TransportERP.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=mission-03-all-tests.trx" | tee mission-03-artifacts/test-all.txt
          cp TransportERP.Tests/TestResults/mission-03-all-tests.trx mission-03-artifacts/

      - name: Boot API and verify HTTP boundary
        shell: bash
        run: |
          dotnet TransportERP.Api/bin/Release/net10.0/TransportERP.Api.dll > mission-03-artifacts/api-boot.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          http_code="000"
          for attempt in $(seq 1 30); do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat mission-03-artifacts/api-boot.log
              exit 1
            fi
            http_code=$(curl --silent --show-error --output mission-03-artifacts/api-response.txt --write-out "%{http_code}" "http://127.0.0.1:5080/api/v1/audit/events?skip=0&take=1" || true)
            if test "$http_code" = "401"; then
              break
            fi
            sleep 1
          done
          echo "http_code=$http_code" | tee mission-03-artifacts/api-http-evidence.txt
          test "$http_code" = "401"
          kill "$api_pid"
          wait "$api_pid" || true
          trap - EXIT

      - name: Upload W0 Linux evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mission-03-w0-linux-${{ github.sha }}
          path: mission-03-artifacts
          if-no-files-found: error

  desktop-probe:
    name: W0 / Desktop Windows build and executable probe
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact execution SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Bind Desktop evidence to exact SHA
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force mission-03-artifacts | Out-Null
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw "Checkout SHA mismatch" }
          @(
            "ref=$env:GITHUB_REF"
            "sha=$(git rev-parse HEAD)"
            "tree=$(git rev-parse 'HEAD^{tree}')"
            "status_begin"
            (git status --short)
            "status_end"
          ) | Set-Content mission-03-artifacts/exact-sha-desktop.txt

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and probe Desktop configuration
        shell: pwsh
        run: |
          dotnet --info | Tee-Object mission-03-artifacts/dotnet-info-desktop.txt
          dotnet restore TransportERP.Desktop/TransportERP.Desktop.csproj | Tee-Object mission-03-artifacts/restore-desktop.txt
          dotnet msbuild TransportERP.Desktop/TransportERP.Desktop.csproj -getProperty:TargetFramework -getProperty:OutputType -getProperty:HasDesktopEntryPoint | Set-Content mission-03-artifacts/probe-desktop.txt

      - name: Build actual Desktop contract surface
        shell: pwsh
        run: |
          dotnet build TransportERP.Desktop/TransportERP.Desktop.csproj --configuration Release --no-restore | Tee-Object mission-03-artifacts/build-desktop.txt
          Get-ChildItem TransportERP.Desktop/bin/Release -Recurse | Select-Object FullName,Length | Format-Table -AutoSize | Out-String | Set-Content mission-03-artifacts/desktop-output-inventory.txt

      - name: Upload W0 Desktop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mission-03-w0-desktop-${{ github.sha }}
          path: mission-03-artifacts
          if-no-files-found: error
